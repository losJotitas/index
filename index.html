<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Plataforma MAPACHE - Ventanilla & Mi Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        html, body { width: 100vw; min-height: 100vh; color: #ffffff; background-color: #0b1324; overflow-y: auto; overflow-x: hidden; }
        #pantalla-portada { position: relative; width: 100vw; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1b2a4a 0%, #0b1324 100%); padding: 30px 12px; }
        .main-container { width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
        .hero-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 18px; width: 100%; }
        .header-brand-container { display: flex; align-items: center; justify-content: center; }
        .titulo-app { font-size: clamp(2rem, 7.8vw, 3rem); font-weight: 800; color: #ffffff; text-shadow: 0 4px 14px rgba(0,0,0,0.6); }
        .subtitulo-app { font-size: 0.9rem; color: #94a3b8; font-weight: 600; }
        .tagline-app { font-size: 0.8rem; color: #38bdf8; font-weight: 700; }
        .linea-decorativa { width: 45px; height: 3px; background: #38bdf8; margin-top: 7px; border-radius: 2px; }
        .btn-acceso-directores-flotante { position: absolute; top: 15px; right: 15px; z-index: 100; background: #2563eb; color: white; border: none; padding: 9px 14px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
        .btn-admin-flotante { position: absolute; top: 15px; left: 15px; z-index: 100; background: #334155; color: #38bdf8; border: 1px solid #38bdf8; padding: 9px 14px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
        .bloque-controles { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 11px; background: rgba(15, 23, 42, 0.88); padding: 18px 16px; border-radius: 24px; border: 2px solid rgba(56, 189, 248, 0.3); }
        .input-busqueda { width: 100%; padding: 14px 16px; background-color: #ffffff; color: #0f172a; border: none; border-radius: 14px; font-size: 13.5px; font-weight: 700; outline: none; }
        .sugerencias-lista { position: absolute; top: 100%; left: 0; width: 100%; background: #ffffff; color: #0f172a; border-radius: 0 0 14px 14px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); z-index: 1000; max-height: 220px; overflow-y: auto; display: none; }
        .sugerencia-item { padding: 11px 14px; font-size: 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-weight: 600; }
        .sugerencia-item:hover { background-color: #e2e8f0; }
        .btn-opcion { width: 100%; padding: 12px 14px; color: #ffffff; border: none; border-radius: 14px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-tour { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .btn-verde { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-azul { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-estatales { background: linear-gradient(135deg, #d97706, #b45309); }
        .btn-particulares { background: linear-gradient(135deg, #0284c7, #0369a1); border: 1.5px solid #fbbf24; }
        .btn-naranja { background: linear-gradient(135deg, #ea580c, #c2410c); }
        .btn-diamante { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
        .fila-botones-dividida { display: flex; gap: 9px; width: 100%; }
        .fila-botones-dividida .btn-opcion { flex: 1; }
        .pantalla-secundaria { display: none !important; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; flex-direction: column; z-index: 50; background-color: #f4f6f9; overflow-y: auto; }
        .pantalla-secundaria.activa { display: flex !important; }
        .top-bar { background: #1a365d; color: white; padding: 10px 15px; display: flex; align-items: center; gap: 10px; z-index: 1000; }
        .btn-volver { background: #2b6cb0; border: 1px solid #4299e1; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .btn-sincronizar-top { background: #16a34a; border: 1px solid #4ade80; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: bold; cursor: pointer; }
        #map { flex: 1; width: 100%; min-height: 300px; }
        .pin-etiqueta-nombre { background: rgba(15, 23, 42, 0.92) !important; color: #38bdf8 !important; border: 1px solid #38bdf8 !important; border-radius: 6px !important; padding: 2px 7px !important; font-size: 10px !important; font-weight: 700 !important; white-space: nowrap !important; }
        .pin-etiqueta-particular { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%) !important; color: #fbbf24 !important; border: 1.5px solid #f59e0b !important; border-radius: 6px !important; padding: 3px 8px !important; font-size: 10.5px !important; font-weight: 800 !important; white-space: nowrap !important; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 19, 36, 0.92); z-index: 20002; justify-content: center; align-items: center; }
        .modal-content-comic { background: #1e293b; padding: 22px 18px; border-radius: 24px; border: 3px solid #38bdf8; text-align: center; max-width: 320px; width: 92%; display: flex; flex-direction: column; align-items: center; }
        .thought-bubble { background: #ffffff; color: #0f172a; padding: 12px 16px; border-radius: 18px; font-weight: 700; font-size: 13px; margin-bottom: 12px; width: 100%; }
        .modal-btn { background: #2563eb; color: white; border: none; padding: 10px 22px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        #modal-detalle { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 20000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 92%; max-width: 550px; max-height: 85vh; border-radius: 18px; overflow-y: auto; padding: 22px 20px; position: relative; color: #2d3748; }
        .modal-close-destacado { position: absolute; top: 12px; right: 14px; background: #ef4444; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 800; cursor: pointer; }
        .school-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.8rem; margin-bottom: 10px; }
        .badge-estatal { background: #fee2e2; color: #991b1b; }
        .badge-particular { background: #fef3c7; color: #92400e; }
        .badge-convenio { background: #e0e7ff; color: #3730a3; }
        .grados-semaforo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 8px; margin: 10px 0; }
        .item-grado-semaforo { padding: 8px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; text-align: center; }
        .sem-verde { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .sem-amarillo { background-color: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .sem-rojo { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .card-seccion { background: white; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #cbd5e1; }
        .contenedor-central { padding: 20px; color: #1e293b; max-width: 700px; margin: 0 auto; }
    </style>
</head>
<body>
    <div id="pantalla-portada">
        <button class="btn-admin-flotante" onclick="abrirAdminDashboard()">⚙️ Admin</button>
        <button class="btn-acceso-directores-flotante" onclick="abrirModalDirector()">🔐 Acceso Directores</button>

        <div class="main-container">
            <div class="hero-header">
                <div class="header-brand-container">
                    <div style="font-size: 3.5rem; margin-right: 10px;">🦝</div>
                    <div>
                        <h1 class="titulo-app">MAPACHE</h1>
                        <p class="subtitulo-app">Ventanilla &amp; Mi Perú</p>
                        <p class="tagline-app">Rastrea, Encuentra, Matricula</p>
                        <div class="linea-decorativa"></div>
                    </div>
                </div>
            </div>

            <div class="bloque-controles">
                <button class="btn-opcion btn-tour" onclick="iniciarTourMapachito(event)">
                    🦝 Tour Interactivo: ¿Cómo buscar un colegio?
                </button>

                <div style="position:relative; width:100%;">
                    <input type="text" id="inputPortada" class="input-busqueda" placeholder="🔍 Nombre o número (Ej: Elim, 121, 5090, Cáceres)..." autocomplete="off">
                    <div id="sugerenciasPortada" class="sugerencias-lista"></div>
                </div>
                
                <button class="btn-opcion btn-verde" onclick="mostrarInfoTodosMapa(event)">Ver Todos los Colegios en el Mapa</button>
                <button class="btn-opcion btn-azul" onclick="abrirModalRedesConMapachito(event)">Filtrar por Redes Educativas (1-9)</button>
                
                <div class="fila-botones-dividida">
                    <button class="btn-opcion btn-estatales" onclick="mostrarInfoEstatales(event)">Colegios Estatales</button>
                    <button class="btn-opcion btn-particulares" onclick="mostrarInfoParticulares(event)">Colegios Particulares ⭐</button>
                </div>
                
                <button class="btn-opcion btn-naranja" onclick="abrirPantallaVacantes(event)">🚦 Buscar Vacantes Disponibles</button>
                <button class="btn-opcion btn-diamante" onclick="abrirPantallaDonaciones(event)">💎 Colaboración y Membresía Digital</button>
            </div>
        </div>
    </div>

    <div id="pantalla-mapa" class="pantalla-secundaria">
        <div class="top-bar">
            <button class="btn-volver" onclick="volverAPortada()">⬅ Volver</button>
            <button class="btn-sincronizar-top" onclick="forzarSincronizacionNubeManual()">🔄 Sincronizar Nube</button>
            <div style="flex:1; position:relative;">
                <input type="text" id="searchInputMap" placeholder="Filtrar en mapa (nombre o número)..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #cbd5e0;">
                <div id="sugerenciasMapa" class="sugerencias-lista"></div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <div id="pantalla-vacantes" class="pantalla-secundaria">
        <div class="top-bar">
            <button class="btn-volver" onclick="volverAPortada()">⬅ Volver</button>
            <button class="btn-sincronizar-top" onclick="forzarSincronizacionNubeManual()">🔄 Sincronizar Nube</button>
            <h3 style="font-size:0.95rem; margin-left:5px;">🚦 Buscador Global</h3>
        </div>
        <div class="contenedor-central">
            <div class="card-seccion">
                <h2 style="color:#1a365d; font-size:1.2rem; margin-bottom:8px;">Vacantes por Grado y Edad en Tiempo Real</h2>
                <input type="text" id="inputBuscadorVacantes" onkeyup="filtrarListaVacantes()" placeholder="🔍 Filtra por nombre, número (Ej. Elim, 121, 5090)..." style="width:100%; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
            </div>
            <div id="lista-vacantes"></div>
        </div>
    </div>

    <div id="modal-detalle" onclick="cerrarDetalleExt(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close-destacado" onclick="cerrarDetalle()">&times;</span>
            <div id="modal-body-content"></div>
        </div>
    </div>

    <div id="modalMapachito" class="modal-overlay" onclick="cerrarModalMapachito()">
        <div class="modal-content-comic" onclick="cerrarModalMapachito()">
            <div id="textoMapachito" class="thought-bubble">¡Hola!</div>
            <div style="font-size:4rem; margin:10px 0;">🦝</div>
            <button id="btnEntendidoModal" class="modal-btn">¡Entendido! 🚀</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // CONFIGURACIÓN DE URL DE GOOGLE APPS SCRIPT
        const URL_API_GOOGLE = "https://script.google.com/macros/s/AKfycby2Y6cDIBQj6lRkAc1eMlfrhMll99Y_LHgb8fkDYHVN66iRrvfiyij1eboTxvCKl_qw/exec";
        
        let colegiosBase = [
            {
                id_colegio: "147",
                codigo: "ELIM",
                nombre_colegio: "I.E.P. ELIM",
                latitud: -11.8712,
                longitud: -77.1265,
                gestion: "Particular",
                distrito: "Ventanilla",
                red_educativa: "Particular / Independiente",
                niveles: "Inicial, Primaria, Secundaria",
                direccion: "Mz. K Lote 12, Satélite, Ventanilla",
                password_director: "in-el",
                estado_vigencia: "Activo"
            },
            {
                id_colegio: "1",
                codigo: "121",
                nombre_colegio: "I.E.I N°121 ANGELITOS DE PACHACÚTEC",
                latitud: -11.8542,
                longitud: -77.1624,
                gestion: "Estatal",
                distrito: "Ventanilla",
                red_educativa: "RED N° 01 - PACHACÚTEC OESTE",
                niveles: "Inicial",
                password_director: "dir-121",
                estado_vigencia: "Activo"
            },
            {
                id_colegio: "14",
                codigo: "5090",
                nombre_colegio: "I.E. N° 5090 ANTONIA MORENO DE CÁCERES",
                latitud: -11.8845,
                longitud: -77.1352,
                gestion: "Estatal",
                distrito: "Ventanilla",
                red_educativa: "RED N° 08 - ANTONIA MORENO DE CÁCERES",
                niveles: "Primaria, Secundaria",
                password_director: "dir-5090",
                estado_vigencia: "Activo"
            }
        ];

        let map = null;
        let marcadores = [];
        let datosVacantesEnVivo = JSON.parse(localStorage.getItem('mapache_vacantes') || '{}');

        function normalizarTexto(txt) {
            if (!txt) return '';
            return String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        function normalizarLimpio(txt) {
            if (!txt) return '';
            return String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
                .replace(/\bi\.?\s*e\.?\s*p\.?\b/g, '')
                .replace(/\bi\.?\s*e\.?\b/g, '')
                .replace(/n[°º. ]*/g, '')
                .replace(/[^a-z0-9]/g, '')
                .trim();
        }

        async function cargarVacantesEnTiempoReal() {
            try {
                const res = await fetch(URL_API_GOOGLE + '?t=' + new Date().getTime(), { cache: 'no-store' });
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    // Mapeo sin descartar colegios con nombre
                    colegiosBase = data.map((item, idx) => {
                        let c = Object.assign({}, item);
                        if (!c.id_colegio) c.id_colegio = 'COL_' + idx;
                        if (!c.codigo) c.codigo = c.id_colegio;
                        if (c.latitud) c.latitud = parseFloat(c.latitud);
                        if (c.longitud) c.longitud = parseFloat(c.longitud);
                        if (item.grados) datosVacantesEnVivo[c.id_colegio] = item.grados;
                        return c;
                    });
                    localStorage.setItem('mapache_vacantes', JSON.stringify(datosVacantesEnVivo));
                }
            } catch (e) {
                console.log("Cargado desde respaldo local:", e);
            }
        }

        function mostrarInfoParticulares(e) {
            if(e) e.stopPropagation();
            ocultarTodasLasPantallas();
            document.getElementById('pantalla-mapa').classList.add('activa');
            setTimeout(() => {
                if(!map) inicializarMapa();
                map.invalidateSize();
                const parts = colegiosBase.filter(c => {
                    const g = normalizarTexto(c.gestion);
                    return g.includes('particular') || g.includes('privad');
                });
                mostrarColegiosEnMapa(parts);
            }, 100);
        }

        function mostrarInfoTodosMapa(e) {
            if(e) e.stopPropagation();
            ocultarTodasLasPantallas();
            document.getElementById('pantalla-mapa').classList.add('activa');
            setTimeout(() => {
                if(!map) inicializarMapa();
                map.invalidateSize();
                mostrarColegiosEnMapa(colegiosBase);
            }, 100);
        }

        function mostrarInfoEstatales(e) {
            if(e) e.stopPropagation();
            ocultarTodasLasPantallas();
            document.getElementById('pantalla-mapa').classList.add('activa');
            setTimeout(() => {
                if(!map) inicializarMapa();
                map.invalidateSize();
                const est = colegiosBase.filter(c => normalizarTexto(c.gestion).includes('estatal'));
                mostrarColegiosEnMapa(est);
            }, 100);
        }

        function inicializarMapa() {
            map = L.map('map').setView([-11.872, -77.135], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        function mostrarColegiosEnMapa(lista) {
            if(!map) return;
            marcadores.forEach(m => map.removeLayer(m));
            marcadores = [];
            if(!lista || lista.length === 0) return;

            lista.forEach(col => {
                if(!col.latitud || !col.longitud) return;
                const esPart = normalizarTexto(col.gestion).includes('particular');
                const color = esPart ? '#0284c7' : '#15803d';
                const m = L.marker([col.latitud, col.longitud]).addTo(map);
                m.bindTooltip(col.nombre_colegio, {
                    permanent: true,
                    direction: 'top',
                    className: esPart ? 'pin-etiqueta-particular' : 'pin-etiqueta-nombre'
                });
                m.bindPopup('<b>' + col.nombre_colegio + '</b><br>' + col.gestion);
                marcadores.push(m);
            });
            if(lista.length > 0 && lista[0].latitud) {
                map.setView([lista[0].latitud, lista[0].longitud], 14);
            }
        }

        function abrirModalDirector() {
            const nom = prompt("Ingresa el Nombre o Número de tu colegio (Ej. ELIM, 121, 5090):");
            if (!nom) return;
            const col = colegiosBase.find(c => {
                const q = normalizarLimpio(nom);
                return normalizarLimpio(c.nombre_colegio).includes(q) || normalizarLimpio(c.codigo).includes(q) || normalizarLimpio(c.id_colegio).includes(q);
            });
            if(!col) {
                alert("Error: No se encontró ningún colegio registrado con ese número, nombre o código.");
                return;
            }
            if(col.estado_vigencia === 'Bloqueado') {
                alert("⛔ ACCESO SUSPENDIDO: El colegio se encuentra bloqueado por regularización de aportación económica.");
                return;
            }
            const pass = prompt("Contraseña de Director para " + col.nombre_colegio + ":");
            if(pass && pass.toLowerCase().trim() === String(col.password_director || '').toLowerCase().trim()) {
                alert("✔ ¡Acceso concedido para " + col.nombre_colegio + "!");
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        function abrirAdminDashboard() {
            const clave = prompt("Ingresa la Contraseña Maestra de Administrador:");
            if(clave === 'mapache2026') {
                alert("Bienvenido al Dashboard Administrativo de MAPACHE.");
            } else {
                alert("Clave incorrecta.");
            }
        }

        function volverAPortada() {
            ocultarTodasLasPantallas();
            document.getElementById('pantalla-portada').style.display = 'flex';
        }

        function ocultarTodasLasPantallas() {
            document.getElementById('pantalla-portada').style.display = 'none';
            document.querySelectorAll('.pantalla-secundaria').forEach(p => p.classList.remove('activa'));
        }

        function forzarSincronizacionNubeManual() {
            cargarVacantesEnTiempoReal().then(() => alert("Sincronización completada."));
        }

        window.onload = function() {
            cargarVacantesEnTiempoReal();
        };
    </script>
</body>
</html>
