<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBIKTUCOLEYA! - Ventanilla & Mi Perú</title>
    <style>
        /* Fondo Azul Marino Profundo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #0d1b2a;
            color: #ffffff;
            text-align: center;
        }

        /* Marcas de Agua Sutiles */
        .marca-agua {
            position: absolute;
            top: 10px;
            font-size: 11px;
            color: #1b263b;
            font-weight: bold;
            user-select: none;
        }
        .marca-jdah { left: 15px; }
        .marca-jotitas { right: 15px; }

        .main-container { max-width: 480px; margin: 0 auto; }

        /* Contenedor del Logo */
        .header-app { margin-top: 15px; margin-bottom: 20px; }

        /* Resplandor de Atardecer Suave (Menos resoplado) */
        .escena-logo {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #e07a5f 0%, #d4a373 55%, rgba(13, 27, 42, 0) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(224, 122, 95, 0.25);
        }

        .logo-svg {
            width: 70px;
            height: 70px;
            fill: #ffffff;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.4));
        }

        h1.titulo-app { font-size: 28px; color: #ffffff; margin: 0; font-weight: 900; letter-spacing: 1px; }
        h2.subtitulo-app, p.lema-app { font-size: 13px; color: #4cc9f0; margin: 3px 0; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

        /* Métricas */
        .grid-metricas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 15px 0;
        }
        .tarjeta-metrica {
            background-color: #1b263b;
            border: 1px solid #415a77;
            border-radius: 10px;
            padding: 8px 4px;
        }
        .numero-metrica { font-size: 18px; font-weight: bold; color: #4cc9f0; }
        .label-metrica { font-size: 10px; color: #e0e1dd; text-transform: uppercase; margin-top: 2px; }

        /* Buscador */
        .input-busqueda {
            width: 100%;
            padding: 13px 15px;
            font-size: 14px;
            border: 2px solid #415a77;
            border-radius: 10px;
            background-color: #1b263b;
            color: #ffffff;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }

        /* Grupo de Botones Principales */
        .grupo-botones {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-opcion {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-mapa { background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%); color: white; }
        .btn-redes { background: linear-gradient(135deg, #7209b7 0%, #4361ee 100%); color: white; }
        .btn-particulares { background-color: #1b263b; border: 1px solid #415a77; color: #e0e1dd; }

        .btn-opcion:active { transform: scale(0.98); }

        /* Secciones de Anuncios y Comunicados */
        .bloque-informacion {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-comunicado {
            background-color: #1b263b;
            border-left: 4px solid #4cc9f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            text-align: left;
            color: #e0e1dd;
        }

        .card-publicidad {
            background-color: #1b263b;
            border: 1px dashed #415a77;
            border-radius: 8px;
            padding: 15px;
            font-size: 11px;
            color: #778da9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <div class="main-container">
        
        <!-- Header / Logo -->
        <header class="header-app">
            <div class="escena-logo">
                <svg class="logo-svg" viewBox="0 0 24 24">
                    <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z" fill="#ffffff"/>
                    <path d="M12 7L16 9.2L12 11.4L8 9.2L12 7Z" fill="#e07a5f"/>
                </svg>
            </div>
            
            <h1 class="titulo-app">UBIKTUCOLEYA!</h1>
            <h2 class="subtitulo-app">VENTANILLA & MI PERÚ</h2>
            <p class="lema-app">TU COLE A UN MAPA DE DISTANCIA</p>
        </header>

        <!-- Métricas -->
        <div class="grid-metricas">
            <div class="tarjeta-metrica">
                <div class="numero-metrica">146</div>
                <div class="label-metrica">Colegios</div>
            </div>
            <div class="tarjeta-metrica">
                <div class="numero-metrica">9</div>
                <div class="label-metrica">Redes</div>
            </div>
            <div class="tarjeta-metrica">
                <div class="numero-metrica">9</div>
                <div class="label-metrica">Zonas</div>
            </div>
        </div>

        <!-- Buscador -->
        <input type="text" class="input-busqueda" placeholder="🔍 Buscar por colegio o número...">

        <!-- Botones de Navegación Directa -->
        <div class="grupo-botones">
            <button class="btn-opcion btn-mapa">🌐 Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion btn-redes">🏫 Filtrar por Redes Educativas (1-9)</button>
            <button class="btn-opcion btn-particulares" onclick="mostrarProximamente()">🏫 Colegios Particulares</button>
        </div>

        <!-- Bloque de Comunicados y Publicidad -->
        <div class="bloque-informacion">
            <div class="card-comunicado">
                <strong style="color: #4cc9f0;">📢 COMUNICADO MATRÍCULA:</strong><br>
                Consulta el estado actualizado de vacantes escolares para Ventanilla, Pachacútec y Mi Perú.
            </div>

            <div class="card-publicidad">
                Espacio Reservado para Anuncios Publicitarios
            </div>
        </div>

    </div>

    <script>
        function mostrarProximamente() {
            alert("Próximamente");
        }
    </script>

</body>
</html>
