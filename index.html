<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBIKTUCOLEYA! - Ventanilla & Mi Perú</title>
    <style>
        /* Estilos Generales - Fondo Azul Noche Elegante */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #0b132b;
            color: #ffffff;
            text-align: center;
        }

        /* Marcas de Agua Discretas */
        .marca-agua {
            position: absolute;
            top: 10px;
            font-size: 11px;
            color: #1c2d42;
            font-weight: bold;
            user-select: none;
        }
        .marca-jdah { left: 15px; }
        .marca-jotitas { right: 15px; }

        .main-container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Logo de Impacto */
        .header-app { margin-top: 15px; margin-bottom: 20px; }
        .escena-logo {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 10px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #ff9e00 0%, #ff5400 60%, rgba(11, 19, 43, 0) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 158, 0, 0.4);
        }
        .icono-casa-estudio { position: relative; font-size: 65px; line-height: 1; }
        .icono-birrete-fachada { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; }

        h1.titulo-app { font-size: 28px; color: #ffffff; margin: 0; font-weight: 900; letter-spacing: 1px; }
        h2.subtitulo-app, p.lema-app { font-size: 13px; color: #4cc9f0; margin: 3px 0; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

        /* Tarjetas de Métricas (Inspirado en la imagen) */
        .grid-metricas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 15px 0;
        }
        .tarjeta-metrica {
            background-color: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 10px;
            padding: 8px 4px;
        }
        .numero-metrica { font-size: 18px; font-weight: bold; color: #4cc9f0; }
        .label-metrica { font-size: 10px; color: #a0aec0; text-transform: uppercase; margin-top: 2px; }

        /* Buscador */
        .input-busqueda {
            width: 100%;
            padding: 12px 15px;
            font-size: 14px;
            border: 2px solid #3a506b;
            border-radius: 10px;
            background-color: #1c2541;
            color: #ffffff;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        .input-busqueda::placeholder { color: #a0aec0; }

        /* Filtro por Redes (Píldoras horizontales de la imagen adaptadas a modo oscuro) */
        .seccion-filtros { text-align: left; margin-bottom: 15px; }
        .titulo-filtro { font-size: 11px; color: #a0aec0; font-weight: bold; margin-bottom: 8px; display: block; letter-spacing: 0.5px; }
        
        .pildoras-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .pildora {
            background-color: #1c2541;
            border: 1px solid #3a506b;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        .pildora.activa {
            background-color: #3a86ff;
            border-color: #3a86ff;
            font-weight: bold;
        }

        /* Simulación del Mapa Integrado */
        .mapa-contenedor {
            width: 100%;
            height: 220px;
            background-color: #2b3a4a;
            border-radius: 12px;
            border: 1px solid #3a506b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            font-size: 13px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        /* Leyenda de Redes por Color */
        .leyenda-colores {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            background-color: #1c2541;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
        }
        .item-leyenda { display: flex; align-items: center; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <div class="main-container">
        
        <!-- Header / Logo -->
        <header class="header-app">
            <div class="escena-logo">
                <div class="icono-casa-estudio">🏫<div class="icono-birrete-fachada">🎓</div></div>
            </div>
            <h1 class="titulo-app">UBIKTUCOLEYA!</h1>
            <h2 class="subtitulo-app">VENTANILLA & MI PERÚ</h2>
            <p class="lema-app">TU COLE A UN MAPA DE DISTANCIA</p>
        </header>

        <!-- Métricas Institucionales (Transmite solidez profesional) -->
        <div class="grid-metricas">
            <div class="tarjeta-metrica">
                <div class="numero-metrica">146</div>
                <div class="label-metrica">Colegios</div>
            </div>
            <div class="tarjeta-metrica">
                <div class="numero-metrica">9</div>
                <div class="label-metrica">Redes</div>
            </div>
            <div class="tarjeta-metrica">
                <div class="numero-metrica">9</div>
                <div class="label-metrica">Zonas</div>
            </div>
        </div>

        <!-- Buscador -->
        <input type="text" class="input-busqueda" placeholder="🔍 Buscar colegio por nombre...">

        <!-- Filtros Rápidos en Píldoras -->
        <div class="seccion-filtros">
            <span class="titulo-filtro">FILTRAR POR RED EDUCATIVA</span>
            <div class="pildoras-container">
                <span class="pildora activa">Todas</span>
                <span class="pildora">R01</span>
                <span class="pildora">R02</span>
                <span class="pildora">R03</span>
                <span class="pildora">R04</span>
                <span class="pildora">R05</span>
                <span class="pildora">R06</span>
                <span class="pildora">R07</span>
                <span class="pildora">R08</span>
                <span class="pildora">R09</span>
            </div>
        </div>

        <!-- Mapa Directo -->
        <div class="mapa-contenedor">
            🗺️ [Mapa Interactivo con Geolocalización y 146 Pines]
        </div>

        <!-- Leyenda de Colores (Como en la imagen, pero estilizada) -->
        <div class="leyenda-colores">
            <span class="item-leyenda"><span class="dot" style="background:#ff4d4d;"></span> R01</span>
            <span class="item-leyenda"><span class="dot" style="background:#3399ff;"></span> R02</span>
            <span class="item-leyenda"><span class="dot" style="background:#00cc66;"></span> R03</span>
            <span class="item-leyenda"><span class="dot" style="background:#ffcc00;"></span> R04</span>
            <span class="item-leyenda"><span class="dot" style="background:#9933ff;"></span> R05</span>
            <span class="item-leyenda"><span class="dot" style="background:#00cccc;"></span> R06</span>
            <span class="item-leyenda"><span class="dot" style="background:#ff9933;"></span> R07</span>
            <span class="item-leyenda"><span class="dot" style="background:#333399;"></span> R08</span>
            <span class="item-leyenda"><span class="dot" style="background:#ff3399;"></span> R09</span>
        </div>

    </div>

</body>
</html>
