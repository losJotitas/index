<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UBIKTUCOLEYA! - Ventanilla & Mi Perú</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* AZUL MUCHO MÁS OSCURO Y PROFUNDO */
    body { margin: 0; padding: 0; background-color: #051A33; font-family: 'Segoe UI', Roboto, sans-serif; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ==== ENCABEZADO IGUAL A TU PORTADA ==== */
    header {
      background: linear-gradient(180deg, #0C3A66 0%, #051A33 100%);
      padding: 12px 20px 18px;
      text-align: center;
      border-bottom: 3px solid #2EA8E0;
      box-shadow: 0 4px 15px rgba(46, 168, 224, 0.25);
      position: relative;
      overflow: hidden;
    }
    /* Brillo amarillo-rojo suave detrás del logo */
    header::before {
      content: '';
      position: absolute;
      top: 15%; left: 50%;
      transform: translateX(-50%);
      width: 260px; height: 130px;
      background: radial-gradient(ellipse at center, rgba(255,210,60,0.35) 0%, rgba(255,110,50,0.18) 55%, transparent 75%);
      border-radius: 50%;
      z-index: 0;
      filter: blur(14px);
    }
    /* Logo: Birrete + Libro + Ubicación */
    .logo-icon {
      position: relative;
      z-index: 1;
      margin-bottom: 4px;
    }
    .logo-icon svg {
      width: 90px; height: auto;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
    }
    /* Título principal — igual que portada */
    header h1 {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      position: relative;
      z-index: 1;
      text-shadow: 0 0 12px rgba(255,255,255,0.2);
    }
    /* Subtítulo: Ventanilla & Mi Perú */
    .subtitulo {
      margin: 2px 0 6px;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #BFE3FF;
      position: relative;
      z-index: 1;
    }
    /* Lema — misma fuente, tamaño y resaltado */
    .lema {
      margin: 8px 0 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      position: relative;
      z-index: 1;
      text-shadow: 0 0 8px rgba(46, 168, 224, 0.3);
      font-style: normal;
    }

    /* ==== CONTROLES ==== */
    .controls {
      background: rgba(12, 58, 102, 0.9);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border-bottom: 2px solid #2EA8E0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .controls label { font-size: 0.9rem; font-weight: 600; color: #BFE3FF; }
    select, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.3s ease;
    }
    select {
      background: rgba(255, 255, 255, 0.95);
      color: #051A33;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
    }
    select:hover { background: #ffffff; }
    button {
      background: linear-gradient(135deg, #2EA8E0, #0C3A66);
      color: #fff;
      margin-left: auto;
      box-shadow: 0 3px 10px rgba(46, 168, 224, 0.3);
    }
    button:hover {
      background: linear-gradient(135deg, #71D1FF, #2EA8E0);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(46, 168, 224, 0.4);
    }

    /* ==== MAPA ==== */
    #map { flex: 1; width: 100%; }

    /* ==== LEYENDA ==== */
    .leyenda {
      background: rgba(5, 26, 51, 0.95);
      padding: 10px 16px;
      font-size: 0.88rem;
      border-top: 2px solid #2EA8E0;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
    }
    .leyenda span { display: flex; align-items: center; gap: 6px; }
    .punto {
      width: 17px; height: 17px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .r4 { background: #FF5722; }
    .r6 { background: #4CAF50; }
    .r8 { background: #FFC107; }
    .r9 { background: #9C27B0; }

    /* ==== VENTANAS DE INFORMACIÓN ==== */
    .popup-foto { width: 250px; }
    .popup-foto img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin: 8px 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      border: 2px solid #2EA8E0;
      display: block;
    }
  </style>
</head>
<body>

<header>
  <!-- Logo: Birrete + Libro + Ubicación -->
  <div class="logo-icon">
    <svg viewBox="0 0 120 80" fill="#ffffff">
      <path d="M60 5 L15 30 L25 35 L60 15 L95 35 L105 30 Z" stroke="#fff" stroke-width="2" fill="none"/>
      <path d="M95 35 L105 70 L90 65 L90 40 Z" fill="#fff" opacity="0.9"/>
      <path d="M20 38 L60 60 L100 38 L60 22 Z" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="60" cy="38" r="12" fill="#fff"/>
      <path d="M60 32 A8 8 0 0 1 68 40 C68 46 60 52 60 52 C60 52 52 46 52 40 A8 8 0 0 1 60 32 Z" fill="#051A33"/>
    </svg>
  </div>
  <h1>UBIKTUCOLEYA!</h1>
  <p class="subtitulo">VENTANILLA & MI PERÚ</p>
  <p class="lema">"TU COLE A UN MAPA DE DISTANCIA"</p>
</header>

<div class="controls">
  <label>Filtrar por Red Educativa:</label>
  <select id="filtroRed">
    <option value="todas">🔴 Todas las Redes</option>
    <option value="4">🟠 Red N° 04 — Pachacútec Este</option>
    <option value="6">🟢 Red N° 06 — Mi Perú</option>
    <option value="8">🟡 Red N° 08 — AMC</option>
    <option value="9">🟣 Red N° 09 — Angamos</option>
  </select>
  <button id="btnVerTodos">📍 Ver todos en el mapa</button>
</div>

<div id="map"></div>

<div class="leyenda">
  <span><b>Red:</b></span>
  <span><span class="punto r4"></span> N°04 Pachacútec Este</span>
  <span><span class="punto r6"></span> N°06 Mi Perú</span>
  <span><span class="punto r8"></span> N°08 AMC</span>
  <span><span class="punto r9"></span> N°09 Angamos</span>
</div>

<script>
const colegios = [
  { id: 1, nombre: "I.E.I N° 125 Divino Niño Jesús", red: 4, zona: "Pachacútec Este", niveles: "Inicial", lat: -11.843456, lng: -77.128518, referencia: "MZ N2 LOTE 1 AA.HH. María Jesús Espinoza", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + Vacunas CRED", foto: "fotos/125_Divino_Nino_Jesus.jpg" },
  { id: 2, nombre: "I.E.I N° 108", red: 4, zona: "Pachacútec Este", niveles: "Inicial", lat: -11.846319, lng: -77.135186, referencia: "MZ. S LT. 1 SECTOR H, BARRIO XVI MERCADO CENTRAL", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + Vacunas CRED", foto: "fotos/108.jpg" },
  { id: 3, nombre: "I.E N° 5147 Santa Rosa de Lima", red: 4, zona: "Pachacútec Este", niveles: "Primaria", lat: -11.8438763, lng: -77.1284196, referencia: "Av. Los Topógrafos MZ. C2 LT. 1 AA.HH. María Jesús Espinoza", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + FUM SIAGIE", foto: "fotos/5147_Santa_Rosa_de_Lima.jpg" },
  { id: 4, nombre: "I.E.I N° 141 Inmaculada Virgen de Guadalupe", red: 6, zona: "Mi Perú", niveles: "Inicial", lat: -11.8591298, lng: -77.1225196, referencia: "MZ E LOTE 1 AA.HH. Virgen de Guadalupe", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + Vacunas CRED", foto: "fotos/141_Inmaculada_Virgen_de_Guadalupe.jpg" },
  { id: 5, nombre: "I.E.I N° 167 Cristo Rey de los Niños", red: 6, zona: "Mi Perú", niveles: "Inicial", lat: -11.8499804, lng: -77.1223254, referencia: "Av. El Bosque MZ. JK Lote 1 AA.HH. Villa Emilia", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + Vacunas CRED", foto: "fotos/167_Cristo_Rey_de_los_Ninos.jpg" },
  { id: 6, nombre: "I.E N° 5119 Villa Emilia", red: 6, zona: "Mi Perú", niveles: "Primaria", lat: -11.8498337, lng: -77.1213922, referencia: "Calle Los Ficus MZ M LOTE 1", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + FUM SIAGIE", foto: "fotos/5119_Villa_Emilia.jpg" },
  { id: 7, nombre: "I.E N° 5151 San Juan Bosco", red: 6, zona: "Mi Perú", niveles: "Secundaria", lat: -11.8505098, lng: -77.1264982, referencia: "Calle Los Ficus MZ L LOTE 1 AA.HH. Villa Emilia", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + FUM SIAGIE", foto: "fotos/5151_San_Juan_Bosco.jpg" },
  { id: 8, nombre: "CEBE Sagrado Corazón de Jesús", red: 6, zona: "Mi Perú", niveles: "Especial", lat: -11.8540579, lng: -77.1230456, referencia: "Av. Trujillo S/N MZ. J 17 LT. 2", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + FUM SIAGIE", foto: "" },
  { id: 9, nombre: "I.E.I N° 107 Los Pastorcitos de Fátima", red: 9, zona: "Angamos", niveles: "Inicial", lat: -11.8860892, lng: -77.1326308, referencia: "Calle 5 Elías Aguirre S/N — AA.HH. Hijos de Grau", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + Vacunas CRED", foto: "fotos/107_Pastorcitos_de_Fatima.jpg" },
  { id: 10, nombre: "I.E.I N° 113 Domingo Savio", red: 8, zona: "AMC", niveles: "Inicial", lat: -11.8873928, lng: -77.1231337, referencia: "MZ F S/N I Sector Derecho - URB. Antonia Moreno de Cáceres", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + Vacunas CRED", foto: "fotos/113_Domingo_Savio.jpg" },
  { id: 11, nombre: "I.E.I N° 133 Divina Pastora", red: 8, zona: "AMC", niveles: "Inicial", lat: -11.8886578, lng: -77.1206898, referencia: "Psje. Johnny Watson S/N II Sector URB. Antonia Moreno de Cáceres", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + Vacunas CRED", foto: "fotos/133_Divina_Pastora.jpg" },
  { id: 12, nombre: "I.E.I N° 135 Mi Pequeño Mundo", red: 8, zona: "AMC", niveles: "Inicial", lat: -11.891201, lng: -77.116792, referencia: "Av. Marcos Calderón S/N IV Sector Antonia Moreno de Cáceres", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + Vacunas CRED", foto: "fotos/135_Mi_Pequeno_Mundo.jpg" },
  { id: 13, nombre: "I.E N° 5090 Antonia Moreno de Cáceres", red: 8, zona: "AMC", niveles: "Primaria / Secundaria", lat: -11.8930743, lng: -77.1123801, referencia: "VI Sector Derecho S/N — Ciudad del Deporte", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + FUM SIAGIE", foto: "fotos/5090_Antonia_Moreno_de_Caceres.jpg" },
  { id: 14, nombre: "I.E N° 5093 Antonio Raymondi", red: 8, zona: "AMC", niveles: "Primaria / Secundaria", lat: -11.8859367, lng: -77.1239704, referencia: "Av. Gonzales Ganoza S/N I Sector URB. Antonia Moreno de Cáceres", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + FUM SIAGIE", foto: "fotos/5093_Antonio_Raymondi.jpg" },
  { id: 15, nombre: "I.E N° 5091 Hijos de Grau", red: 9, zona: "Angamos", niveles: "Primaria", lat: -11.8863777, lng: -77.1324341, referencia: "MZ O S/N Hijos del Almirante Miguel Grau — III Sector Angamos", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + FUM SIAGIE", foto: "fotos/5091_Hijos_de_Grau.jpg" },
  { id: 16, nombre: "Coprodeli La Providencia Virgen de Chapí", red: 9, zona: "Angamos", niveles: "Cuna Jardín", lat: -11.8853088, lng: -77.1333501, referencia: "AA.HH. Hijos de Grau", turnos: "Mañana / Tarde", requisitos: "DNI (2 copias) + DNI Apoderado (1 copia) + FUM SIAGIE", foto: "fotos/Coprodeli_Virgen_de_Chapi.jpg" }
];

const colores = { 4: '#FF5722', 6: '#4CAF50', 8: '#FFC107', 9: '#9C27B0' };

const map = L.map('map').setView([-11.868, -77.125], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);

let marcadores = [];

function dibujarMarcadores(redFiltro) {
  marcadores.forEach(m => map.removeLayer(m));
  marcadores = [];
  colegios.forEach(c => {
    if (redFiltro !== 'todas' && c.red !== parseInt(redFiltro)) return;
    const color = colores[c.red];
    const icono = L.divIcon({
      className: 'pin-personalizado',
      html: `<div style="width:26px;height:26px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.4);"></div>`,
      iconSize: [26,26],
      iconAnchor: [13,13]
    });
    let contenido = `<div class="popup-foto">
      <h4 style="margin:4px 0 8px 0; color:${color}; font-size: 1.15rem; border-bottom: 2px solid ${color}33; padding-bottom: 6px;">${c.nombre}</h4>
      <p><b>Red N° ${c.red}</b> · ${c.zona}</p>
      <p><b>Nivel:</b> ${c.niveles}</p>
      <p><b>Referencia:</b> ${c.referencia}</p>
      <p><b>Turnos:</b> ${c.turnos}</p>
      <p><b>Requisitos:</b> ${c.requisitos}</p>`;
    if (c.foto) {
      contenido += `<img src="${c.foto}" alt="Foto del colegio" onerror="this.outerHTML='<p style=\\'color:#888;font-size:0.85rem\\'>📷 Foto no disponible</p>'"/>`;
    }
    contenido += `<p style="font-size:0.75rem; color:#666; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #ccc;">📍 ${c.lat}, ${c.lng}</p></div>`;
    const m = L.marker([c.lat, c.lng], {icon: icono}).addTo(map).bindPopup(contenido);
    marcadores.push(m);
  });
}

dibujarMarcadores('todas');

document.getElementById('filtroRed').addEventListener('change', e => {
  dibujarMarcadores(e.target.value);
});

document.getElementById('btnVerTodos').addEventListener('click', () => {
  document.getElementById('filtroRed').value = 'todas';
  dibujarMarcadores('todas');
  map.setView([-11.868, -77.125], 13);
});
</script>
</body>
</html>
