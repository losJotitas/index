<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPACHE - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Fondo con degradado profundo en tonos morado/azul para máximo contraste */
    body {
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 15px 15px 40px 15px;
        background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
        background-attachment: fixed;
        color: #ffffff;
        text-align: center;
        min-height: 100vh;
        box-sizing: border-box;
    }

    .main-container { 
        max-width: 420px; 
        margin: 0 auto; 
    }

    .header-portada {
        position: relative;
        width: 100%;
        margin-top: 5px;
        margin-bottom: 20px;
    }

    /* Imagen de Portada resaltada con marco suave y sombra de elevación */
    .imagen-portada {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 24px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.2);
    }

    /* Buscador traslúcido estilizado con contraste */
    .input-busqueda {
        width: 100%;
        padding: 16px;
        font-size: 14px;
        font-weight: 600;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 18px;
        background-color: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        box-sizing: border-box;
        margin-bottom: 20px;
        outline: none;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        transition: all 0.2s ease;
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 500; }
    .input-busqueda:focus { 
        border-color: #ff7e36; 
        box-shadow: 0 4px 20px rgba(255, 126, 54, 0.4); 
    }

    /* Botones de Navegación con alto contraste */
    .grupo-botones {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .btn-opcion {
        width: 100%;
        padding: 16px;
        border-radius: 18px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
        background-color: #0284c7;
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
    }

    .btn-opcion:active { transform: scale(0.98); }

    /* Botón Destacado en Naranja Neón / Cálido */
    .btn-destacado {
        background: linear-gradient(135deg, #ff7300 0%, #f95316 100%);
        box-shadow: 0 8px 22px rgba(249, 83, 22, 0.5);
    }

    /* Marcas de Agua visibles en fondo oscuro */
    .marca-agua {
        position: fixed;
        bottom: 12px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 800;
        letter-spacing: 0.5px;
        user-select: none;
        pointer-events: none;
        z-index: 999;
    }
    .marca-jdah { left: 15px; }
    .marca-jotitas { right: 15px; }

    /* Toast "Próximamente" */
    .toast-notificacion {
        visibility: hidden;
        min-width: 160px;
        background-color: #a855f7;
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 20px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 45px;
        transform: translateX(-50%);
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <header class="header-portada">
            <img src="portada.jpg" alt="MAPACHE - Ventanilla & Mi Perú" class="imagen-portada">
        </header>

        <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

        <div class="grupo-botones">
            <button class="btn-opcion btn-destacado">🌐 Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion">🏫 Filtrar por Redes Educativas (1-9)</button>
            <button class="btn-opcion" onclick="lanzarToast()">🏫 Filtrar por Colegios Particulares</button>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
