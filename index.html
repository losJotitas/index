<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPACHE - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Estructura Limpia e Iluminada */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 50%, #e0e7ff 100%);
        color: #0f172a;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .main-container { 
        width: 100%;
        max-width: 420px; 
        height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Portada en la parte superior sobre fondo claro */
    .header-portada {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 8px;
        box-sizing: border-box;
    }

    .imagen-portada {
        width: 100%;
        height: 85%;
        object-fit: contain;
        image-rendering: -webkit-optimize-contrast;
        filter: drop-shadow(0 8px 20px rgba(15, 23, 42, 0.15));
    }

    /* Difuminado suave e iluminado hacia la base para lectura fácil */
    .main-container::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60vh;
        background: linear-gradient(180deg, rgba(241, 245, 249, 0) 0%, rgba(241, 245, 249, 0.85) 35%, rgba(241, 245, 249, 0.98) 100%);
        z-index: 2;
        pointer-events: none;
    }

    /* Bloque del Buscador y Botones Centrados */
    .bloque-controles {
        position: absolute;
        top: 62%;
        transform: translateY(-50%);
        width: 90%;
        max-width: 380px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Buscador traslúcido en cristal blanco limpio */
    .input-busqueda {
        width: 100%;
        padding: 13px 16px;
        font-size: 13.5px;
        font-weight: 700;
        border: 2px solid #ffffff;
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.92);
        color: #0f172a;
        box-sizing: border-box;
        outline: none;
        text-align: center;
        box-shadow: 0 8px 20px rgba(148, 163, 184, 0.25);
        backdrop-filter: blur(8px);
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 600; }
    .input-busqueda:focus { 
        border-color: #3b82f6; 
        box-shadow: 0 4px 18px rgba(59, 130, 246, 0.3); 
    }

    /* Grupo de Botones */
    .grupo-botones {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    /* Estilo Base de Botones Vivos y Cristalinos */
    .btn-opcion {
        width: 100%;
        padding: 13px 14px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-sizing: border-box;
        border: 1.5px solid rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(6px);
        letter-spacing: 0.2px;
    }

    .btn-opcion:active { transform: scale(0.98); }

    /* 1. Ver Todos los Colegios: Naranja Coral Cálido (Destacado y Amigable) */
    .btn-coral {
        background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(255, 126, 95, 0.35);
    }

    /* 2. Redes Educativas: Azul Ciel Claro (Fresco y Profesional) */
    .btn-ciel {
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
    }

    /* Fila dividida */
    .fila-botones-dividida {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .fila-botones-dividida .btn-opcion {
        flex: 1;
        padding: 12px 8px;
        font-size: 11.5px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 3. Colegios Estatales: Verde Menta Claro (Limpio e Institucional) */
    .btn-menta {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
    }

    /* 4. Colegios Particulares: Púrpura Lavanda / Fucsia Suave */
    .btn-lavanda {
        background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(168, 85, 247, 0.35);
    }

    /* Marcas de agua legibles sobre fondo claro */
    .marca-agua {
        position: fixed;
        bottom: 8px;
        font-size: 10px;
        color: #475569;
        font-weight: 800;
        letter-spacing: 0.5px;
        user-select: none;
        pointer-events: none;
        z-index: 999;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }
    .marca-jdah { left: 15px; }
    .marca-jotitas { right: 15px; }

    /* Toast notification */
    .toast-notificacion {
        visibility: hidden;
        min-width: 140px;
        background-color: #0f172a;
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 18px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.3);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }

    /* Adaptación para PC */
    @media (min-width: 768px) {
        .bloque-controles {
            top: 58%;
            max-width: 420px;
        }

        .input-busqueda {
            padding: 15px;
            font-size: 14px;
        }

        .btn-opcion {
            padding: 15px;
            font-size: 14px;
        }

        .fila-botones-dividida .btn-opcion {
            font-size: 13px;
            padding: 14px 10px;
        }
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <header class="header-portada">
            <img src="portada.jpg" alt="MAPACHE - Ventanilla & Mi Perú" class="imagen-portada">
        </header>

        <div class="bloque-controles">
            <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

            <div class="grupo-botones">
                <button class="btn-opcion btn-coral">🌐 Ver Todos los Colegios en el Mapa</button>
                <button class="btn-opcion btn-ciel">🏫 Filtrar por Redes Educativas (1-9)</button>
                
                <div class="fila-botones-dividida">
                    <button class="btn-opcion btn-menta">🏫 Colegios Estatales</button>
                    <button class="btn-opcion btn-lavanda" onclick="lanzarToast()">🏫 Colegios Particulares</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
