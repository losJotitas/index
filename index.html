<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAPACHE - Ventanilla & Mi Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Librería Lottie Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    
    <style>
        /* 1. Configuración general */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: #0f172a;
            overflow-y: auto;          
            overscroll-behavior-y: auto; 
        }

        /* 2. Fondo de pantalla fijo */
        .fondo-portada {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            pointer-events: none; 
            overflow: hidden;
        }

        .img-celular {
            display: block;
            width: 100%;
            height: 100%; 
            object-fit: cover; 
            position: absolute;
            top: 0; 
            left: 0;
        }

        .img-pc {
            display: none;
            width: 100%;       
            height: 100%;
            object-fit: fill; 
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 3. Contenedor principal para celular por defecto */
        .main-container { 
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 2;
            max-width: 390px; 
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 4. Bloque del Buscador y Botones */
        .bloque-controles {
            width: 90%;                    
            max-width: 340px;              
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 23, 42, 0.88); 
            padding: 16px;
            border-radius: 22px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.3); 
            box-sizing: border-box;
        }

        .input-busqueda {
            width: 100%;
            padding: 14px 16px;
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        .btn-opcion {
            width: 100%;
            padding: 14px 16px;
            color: #ffffff;            
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-opcion:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .btn-verde {
            background-color: #729b79; 
            box-shadow: 0 0 12px rgba(114, 155, 121, 0.4);
        }

        .btn-azul {
            background-color: #7b8db9; 
            box-shadow: 0 0 12px rgba(123, 141, 185, 0.4);
        }

        .btn-estatales {
            background-color: #d18b6d; 
            box-shadow: 0 0 12px rgba(209, 139, 109, 0.4);
        }

        .btn-particulares {
            background-color: #a8a697; 
            color: #1e293b;            
            box-shadow: 0 0 12px rgba(168, 166, 151, 0.4);
        }

        .fila-botones-dividida {
            display: flex; 
            gap: 8px; 
            width: 100%;
        }

        .fila-botones-dividida .btn-opcion {
            flex: 1; 
        }

        /* 5. Ventana Modal Universal (Sólida, sin rastros de fantasma) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 19, 36, 0.92); 
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-content-comic {
            background: #1e293b; 
            padding: 24px 20px;
            border-radius: 24px;
            border: 3px solid #38bdf8; 
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.9);
            max-width: 290px;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: entradaSolida 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes entradaSolida {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .thought-bubble {
            position: relative;
            background: #ffffff;
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            width: 85%;
            box-sizing: border-box;
        }

        .thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
        }
        .thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%) translateX(-4px);
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
        }

        .raccoon-lottie-container {
            width: 140px;
            height: 160px;
            margin-bottom: 16px;
            background: #ffffff; 
            border-radius: 16px;  
            border: 2px solid #cbd5e1; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .modal-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        /* 6. Adaptación específica para PC (Centrado exacto en pantalla) */
        @media (min-width: 769px) {
            .img-celular { display: none; }
            .img-pc { display: block; }

            .main-container {
                max-width: 1000px;
                /* Centrado perfecto vertical y horizontalmente en PC */
                justify-content: center;
                padding-top: 50px; 
            }

            .bloque-controles {
                width: 100%;
                max-width: 480px;          
                padding: 20px 24px;             
                gap: 12px;
                border-radius: 22px;
            }

            .input-busqueda, .btn-opcion {
                padding: 13px 18px;        
                font-size: 14px;           
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo adaptativo -->
    <div class="fondo-portada">
        <img src="portada-celular.jpg" alt="Portada Celular" class="img-celular">
        <img src="portada-pc.jpg" alt="Portada PC" class="img-pc">
    </div>

    <!-- Controles principales -->
    <div class="main-container">
        <div class="bloque-controles">
            <input type="text" class="input-busqueda" placeholder="Buscar por nombre o número...">
            
            <button class="btn-opcion btn-verde" onclick="abrirModalMapachito('olfateando')">Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion btn-azul" onclick="abrirModalMapachito('pensando')">Filtrar por Redes Educativas (1-9)</button>
            
            <div class="fila-botones-dividida">
                <button class="btn-opcion btn-estatales" onclick="abrirModalMapachito('feliz')">Colegios Estatales</button>
                <button class="btn-opcion btn-particulares" onclick="abrirModalMapachito('sorprendido')">Colegios Particulares</button>
            </div>
        </div>
    </div>

    <!-- Modal Universal de Mapachito -->
    <div id="modalMapachito" class="modal-overlay" onclick="cerrarModalMapachito()">
        <div class="modal-content-comic" onclick="event.stopPropagation()">
            <div id="textoMapachito" class="thought-bubble">
                ¡Hola!
            </div>
            
            <div class="raccoon-lottie-container">
                <lottie-player 
                    id="animacionLottie"
                    background="transparent"    
                    speed="1"                   
                    style="width: 100%; height: 100%;" 
                    loop                        
                    autoplay                    
                ></lottie-player>
            </div>

            <button class="modal-btn" onclick="cerrarModalMapachito()">Aceptar</button>
        </div>
    </div>

    <!-- Lógica de JavaScript -->
    <script>
        const modalEl = document.getElementById('modalMapachito');
        const textoEl = document.getElementById('textoMapachito');
        const animacionEl = document.getElementById('animacionLottie');
        
        let tiempoInactividad;
        const SEGUNDOS_PARA_DORMIR = 30;

        function abrirModalMapachito(estado) {
            reiniciarTemporizadorInactividad();

            let archivoJson = '';
            let textoMensaje = '';

            switch (estado) {
                case 'saludando':
                    archivoJson = 'mapache_saludando.json';
                    textoMensaje = '¡Hola! Bienvenidos a Ventanilla y Mi Perú.';
                    break;
                case 'feliz':
                    archivoJson = 'mapache_feliz.json';
                    textoMensaje = '¡Excelente! Aquí tienes la información.';
                    break;
                case 'pensando':
                    archivoJson = 'mapache_pensando.json';
                    textoMensaje = 'Analizando las redes educativas...';
                    break;
                case 'olfateando':
                    archivoJson = 'mapache_olfateando.json';
                    textoMensaje = 'Rastreando colegios en el mapa...';
                    break;
                case 'sorprendido':
                    archivoJson = 'mapache_sorprendido.json';
                    textoMensaje = '¡Próximamente más novedades!';
                    break;
                case 'durmiendo':
                    archivoJson = 'mapache_durmiendo.json';
                    textoMensaje = 'Zzz... Mapachito descansa un momento.';
                    break;
                default:
                    archivoJson = 'mapache_feliz.json';
                    textoMensaje = '¡Hola!';
                    break;
            }

            animacionEl.load(archivoJson);
            textoEl.innerText = textoMensaje;
            modalEl.style.display = 'flex';

            if(estado === 'durmiendo') {
                pararTemporizadorInactividad();
            }
        }

        function cerrarModalMapachito() {
            modalEl.style.display = 'none';
            reiniciarTemporizadorInactividad();
        }

        function irAEstadoDurmiente() {
            if (modalEl.style.display === 'none') {
                abrirModalMapachito('durmiendo');
            }
        }

        function reiniciarTemporizadorInactividad() {
            clearTimeout(tiempoInactividad);
            tiempoInactividad = setTimeout(irAEstadoDurmiente, SEGUNDOS_PARA_DORMIR * 1000);
        }

        function pararTemporizadorInactividad() {
            clearTimeout(tiempoInactividad);
        }

        window.onload = function() {
            abrirModalMapachito('saludando');

            window.addEventListener('mousemove', reiniciarTemporizadorInactividad);
            window.addEventListener('mousedown', reiniciarTemporizadorInactividad);
            window.addEventListener('keypress', reiniciarTemporizadorInactividad);
            window.addEventListener('touchstart', reiniciarTemporizadorInactividad);
        };
    </script>

</body>
</html>
