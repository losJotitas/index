<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAPACHE - Ventanilla & Mi Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. Configuración general y soporte de refresh nativo */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: #0f172a;
            overflow-y: auto;          
            overscroll-behavior-y: auto; 
        }

        /* 2. Contenedor del fondo de pantalla fijo */
        .fondo-portada {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            pointer-events: none; 
            overflow: hidden;
        }

        /* 3. Control inteligente de imágenes de fondo */
        .img-celular {
            display: block;
            width: 100%;
            height: 82%; 
            object-fit: fill; 
            position: absolute;
            top: 2%; 
            left: 0;
            object-position: center; 
        }

        .img-pc {
            display: none;
            width: 98%;       
            height: 100%;
            object-fit: fill; 
            margin-left: 1%;  
        }

        /* 4. Contenedor principal estático y centrado */
        .main-container { 
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 2;
            max-width: 390px; 
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 5. Bloque del Buscador y Botones (Con márgenes laterales elegantes en celular) */
        .bloque-controles {
            width: 90%;                    
            max-width: 340px;              
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(15, 23, 42, 0.7);
            padding: 14px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .input-busqueda, .btn-opcion {
            width: 100%;
            box-sizing: border-box;
        }

        /* 6. Adaptación para Computadora / PC (Pantallas mayores a 768px) */
        @media (min-width: 769px) {
            .img-celular {
                display: none;
            }
            .img-pc {
                display: block;
            }

            .bloque-controles {
                width: 100%;
                max-width: 520px;          
                padding: 22px;             
                gap: 14px;
                border-radius: 24px;
            }

            .input-busqueda {
                padding: 16px 20px;
                font-size: 15px;           
                border-radius: 16px;
            }

            .btn-opcion {
                padding: 16px 20px;        
                font-size: 15px;           
                border-radius: 16px;
            }

            .fila-botones-dividida .btn-opcion {
                padding: 15px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo de pantalla con las dos imágenes adaptativas -->
    <div class="fondo-portada">
        <img src="portada-celular.jpg" alt="Portada Celular" class="img-celular">
        <img src="portada-pc.jpg" alt="Portada PC" class="img-pc">
    </div>

    <!-- Contenedor principal de la interfaz y botones -->
    <div class="main-container">
        <div class="bloque-controles">
            <!-- Aquí van tus elementos de búsqueda y botones actuales -->
            <input type="text" class="input-busqueda" placeholder="Buscar por nombre o número...">
            <button class="btn-opcion">Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion">Filtrar por Redes Educativas (1-9)</button>
            <div class="fila-botones-dividida" style="display: flex; gap: 8px; width: 100%;">
                <button class="btn-opcion">Colegios Estatales</button>
                <button class="btn-opcion">Colegios Particulares</button>
            </div>
        </div>
    </div>

</body>
</html>
