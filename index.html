<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPACHE - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Configuración de Pantalla Completa para Celular */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #1b0c36 0%, #4a6fa5 100%);
        background-attachment: fixed;
        color: #ffffff;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 10px 12px 30px 12px;
        box-sizing: border-box;
    }

    .main-container { 
        width: 100%;
        max-width: 440px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Contenedor de Portada para ocupar el máximo espacio visible */
    .header-portada {
        width: 100%;
        height: 68vh; /* Ocupa el 68% de la altura total de la pantalla */
        max-height: 520px;
        margin-top: 5px;
        margin-bottom: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* Imagen optimizada para máxima nitidez sin pixelado */
    .imagen-portada {
        width: 100%;
        height: 100%;
        object-fit: contain; /* Garantiza que todo el texto y mapa entren completos sin recortarse */
        border-radius: 20px;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
        /* Renderizado nítido */
        image-rendering: -webkit-optimize-contrast;
    }

    /* Buscador traslúcido */
    .input-busqueda {
        width: 100%;
        padding: 15px;
        font-size: 14px;
        font-weight: 600;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        box-sizing: border-box;
        margin-bottom: 14px;
        outline: none;
        text-align: center;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 500; }
    .input-busqueda:focus { 
        border-color: #ff7e36; 
        box-shadow: 0 4px 20px rgba(255, 126, 54, 0.4); 
    }

    /* Botones de Navegación Compactos */
    .grupo-botones {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .btn-opcion {
        width: 100%;
        padding: 14px;
        border-radius: 16px;
        font-size: 13.5px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s;
        box-sizing: border-box;
        background-color: #0284c7;
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
    }

    .btn-opcion:active { transform: scale(0.98); }

    .btn-destacado {
        background: linear-gradient(135deg, #ff7300 0%, #f95316 100%);
        box-shadow: 0 6px 18px rgba(249, 83, 22, 0.5);
    }

    /* Marcas de Agua */
    .marca-agua {
        position: fixed;
        bottom: 8px;
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 800;
        letter-spacing: 0.5px;
        user-select: none;
        pointer-events: none;
        z-index: 999;
    }
    .marca-jdah { left: 12px; }
    .marca-jotitas { right: 12px; }

    /* Toast "Próximamente" */
    .toast-notificacion {
        visibility: hidden;
        min-width: 160px;
        background-color: #a855f7;
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 20px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <header class="header-portada">
            <img src="portada.jpg" alt="MAPACHE - Ventanilla & Mi Perú" class="imagen-portada">
        </header>

        <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

        <div class="grupo-botones">
            <button class="btn-opcion btn-destacado">🌐 Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion">🏫 Filtrar por Redes Educativas (1-9)</button>
            <button class="btn-opcion" onclick="lanzarToast()">🏫 Filtrar por Colegios Particulares</button>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
