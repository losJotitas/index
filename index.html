<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAPACHE - Ventanilla & Mi Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. Configuración general y soporte de refresh nativo */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: #0f172a;
            overflow-y: auto;          
            overscroll-behavior-y: auto; 
        }

        /* 2. Contenedor del fondo de pantalla fijo */
        .fondo-portada {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            pointer-events: none; 
            overflow: hidden;
        }

        /* 3. Control inteligente de imágenes de fondo */
        .img-celular {
            display: block;
            width: 100%;
            height: 100%; 
            object-fit: fill; 
            position: absolute;
            top: 0; 
            left: 0;
            object-position: center; 
        }

        .img-pc {
            display: none;
            width: 100%;       
            height: 100%;
            object-fit: fill; 
            margin-left: 0;  
        }

        /* 4. Contenedor principal estático y centrado */
        .main-container { 
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 2;
            max-width: 390px; 
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 5. Bloque del Buscador y Botones */
        .bloque-controles {
            width: 90%;                    
            max-width: 340px;              
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85); 
            padding: 16px;
            border-radius: 22px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.3); 
            box-sizing: border-box;
        }

        .input-busqueda {
            width: 100%;
            padding: 14px 16px;
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        .btn-opcion {
            width: 100%;
            padding: 14px 16px;
            color: #ffffff;            
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-opcion:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .btn-verde {
            background-color: #729b79; 
            box-shadow: 0 0 12px rgba(114, 155, 121, 0.4);
        }

        .btn-azul {
            background-color: #7b8db9; 
            box-shadow: 0 0 12px rgba(123, 141, 185, 0.4);
        }

        .btn-estatales {
            background-color: #d18b6d; 
            box-shadow: 0 0 12px rgba(209, 139, 109, 0.4);
        }

        .btn-particulares {
            background-color: #a8a697; 
            color: #1e293b;            
            box-shadow: 0 0 12px rgba(168, 166, 151, 0.4);
        }

        .fila-botones-dividida {
            display: flex; 
            gap: 8px; 
            width: 100%;
        }

        .fila-botones-dividida .btn-opcion {
            flex: 1; 
        }

        /* 6. Widget Flotante de Mapachito (Asistente con carita profesional extraída de tu imagen) */
        .mapachito-flotante {
            position: absolute;
            bottom: 25px;
            right: 20px;
            z-index: 5;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            cursor: pointer;
            /* Animación más dinámica de salto */
            animation: saltoDivertido 2.5s infinite ease-in-out;
        }

        .mensaje-mapachito {
            background: #ffffff;
            color: #0f172a;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 150px;
            text-align: right;
            position: relative;
        }

        /* Burbuja de diálogo apuntando hacia Mapachito */
        .mensaje-mapachito::after {
            content: '';
            position: absolute;
            right: -7px;
            bottom: 12px;
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 10px solid #ffffff;
        }

        /* Avatar flotante con la carita adorable extraída de tu imagen */
        .avatar-mapachito {
            width: 65px;
            height: 65px;
            border: 4px solid #ffffff;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            /* Gradiente de fondo que combina con el diseño */
            background: radial-gradient(circle, #38bdf8 0%, #0f172a 100%);
            transition: transform 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-mapachito img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ajuste para que la carita se vea completa sin recortar el rostro principal */
            padding: 4px;
            /* Pequeño brillo sutil para el efecto de ternura */
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
        }

        .mapachito-flotante:hover .avatar-mapachito {
            transform: scale(1.15) rotate(5deg);
        }

        /* Animación de rebote / salto divertido */
        @keyframes saltoDivertido {
            0%, 100% { transform: translateY(0); animation-timing-function: ease-out; }
            50% { transform: translateY(-25px); animation-timing-function: ease-in; }
            60% { transform: translateY(-15px); }
            75% { transform: translateY(-20px); }
        }

        /* 7. Ventana Modal Emergente para Colegios Particulares (manteniendo el mapache de cuerpo entero de alta calidad) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content-comic {
            background: rgba(15, 23, 42, 0.95);
            padding: 24px 20px;
            border-radius: 24px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.8);
            max-width: 290px;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .thought-bubble {
            position: relative;
            background: #ffffff;
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 85%;
            box-sizing: border-box;
        }

        .thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
        }
        .thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%) translateX(-4px);
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
        }

        .raccoon-svg-container {
            width: 120px;
            height: 140px;
            margin-bottom: 16px;
            animation: jumpRaccoon 0.8s infinite alternate ease-in-out;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6));
        }

        @keyframes jumpRaccoon {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.03); }
        }

        .modal-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        /* 8. Adaptación para Computadora / PC */
        @media (min-width: 769px) {
            .img-celular {
                display: none;
            }
            .img-pc {
                display: block;
            }

            .bloque-controles {
                width: 100%;
                max-width: 520px;          
                padding: 24px;             
                gap: 16px;
                border-radius: 26px;
            }

            .input-busqueda {
                padding: 16px 20px;
                font-size: 15px;           
                border-radius: 16px;
            }

            .btn-opcion {
                padding: 16px 20px;        
                font-size: 15px;           
                border-radius: 16px;
            }

            .fila-botones-dividida .btn-opcion {
                padding: 16px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo de pantalla adaptativo -->
    <div class="fondo-portada">
        <img src="portada-celular.jpg" alt="Portada Celular" class="img-celular">
        <img src="portada-pc.jpg" alt="Portada PC" class="img-pc">
    </div>

    <!-- Contenedor principal de la interfaz y botones -->
    <div class="main-container">
        <div class="bloque-controles">
            <input type="text" class="input-busqueda" placeholder="Buscar por nombre o número...">
            <button class="btn-opcion btn-verde">Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion btn-azul">Filtrar por Redes Educativas (1-9)</button>
            <div class="fila-botones-dividida">
                <button class="btn-opcion btn-estatales">Colegios Estatales</button>
                <button class="btn-opcion btn-particulares" onclick="mostrarAviso();">Colegios Particulares</button>
            </div>
        </div>
    </div>

    <!-- WIDGET FLOTANTE DE MAPACHITO (Rediseñado con la carita real de tu imagen) -->
    <div class="mapachito-flotante" onclick="mostrarAvisoMapachito()">
        <div class="mensaje-mapachito">¡
