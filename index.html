  <style>
    body { margin: 0; padding: 0; background-color: #06223F; font-family: 'Segoe UI', Roboto, sans-serif; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* ==== PORTADA / ENCABEZADO PRINCIPAL ==== */
    header { 
      background: linear-gradient(180deg, #0F4C81 0%, #06223F 100%); 
      padding: 14px 20px; 
      text-align: center; 
      border-bottom: 3px solid #2EA8E0; 
      box-shadow: 0 4px 15px rgba(46, 168, 224, 0.25); 
      position: relative; 
      overflow: hidden; 
    }
    /* Brillo sol amarillo-rojo difuminado detrás de la silueta */
    header::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 320px; height: 140px;
      background: radial-gradient(ellipse at center, rgba(255,200,0,0.35) 0%, rgba(255,100,30,0.15) 45%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
      filter: blur(12px);
    }
    /* Silueta de familia: papá, mamá e hijo */
    .silueta-familia {
      position: relative;
      z-index: 1;
      margin-bottom: 6px;
    }
    .silueta-familia svg {
      height: 52px;
      filter: drop-shadow(0 0 8px rgba(255,180,0,0.6));
    }
    header h1 { 
      margin: 0; 
      font-size: 1.9rem; 
      color: #fff; 
      text-shadow: 0 0 18px rgba(46, 168, 224, 0.6); 
      font-weight: 800; 
      letter-spacing: 1px; 
      position: relative; 
      z-index: 1; 
    }
    header p { 
      margin: 6px 0 0 0; 
      font-size: 1.05rem; 
      color: #BFE3FF; 
      font-weight: 400; 
      letter-spacing: 0.7px; 
      font-style: italic; 
      position: relative; 
      z-index: 1; 
    }

    /* ==== CONTROLES ==== */
    .controls { 
      background: rgba(15, 76, 129, 0.9); 
      padding: 10px 16px; 
      display: flex; 
      flex-wrap: wrap; 
      gap: 10px; 
      align-items: center; 
      border-bottom: 2px solid #2EA8E0; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); 
    }
    .controls label { font-size: 0.9rem; font-weight: 600; color: #BFE3FF; }
    select, button { 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: none; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 0.88rem; 
      transition: all 0.3s ease; 
    }
    select { 
      background: rgba(255, 255, 255, 0.95); 
      color: #06223F; 
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.15); 
    }
    select:hover { background: #ffffff; }
    button { 
      background: linear-gradient(135deg, #2EA8E0, #0F4C81); 
      color: #fff; 
      margin-left: auto; 
      box-shadow: 0 3px 10px rgba(46, 168, 224, 0.3); 
    }
    button:hover { 
      background: linear-gradient(135deg, #71D1FF, #2EA8E0); 
      transform: translateY(-2px); 
      box-shadow: 0 5px 15px rgba(46, 168, 224, 0.4); 
    }

    /* ==== MAPA ==== */
    #map { flex: 1; width: 100%; }

    /* ==== LEYENDA ==== */
    .leyenda { 
      background: rgba(6, 34, 63, 0.95); 
      padding: 10px 16px; 
      font-size: 0.88rem; 
      border-top: 2px solid #2EA8E0; 
      display: flex; 
      flex-wrap: wrap; 
      gap: 16px; 
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2); 
    }
    .leyenda span { display: flex; align-items: center; gap: 6px; }
    .punto { 
      width: 17px; height: 17px; 
      border-radius: 50%; 
      border: 3px solid #fff; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.4); 
    }
    .r4 { background: #FF5722; }
    .r6 { background: #4CAF50; }
    .r8 { background: #FFC107; }
    .r9 { background: #9C27B0; }

    /* ==== VENTANAS DE INFORMACIÓN ==== */
    .popup-foto { width: 250px; }
    .popup-foto img { 
      width: 100%; 
      border-radius: 10px; 
      margin: 8px 0; 
      box-shadow: 0 3px 10px rgba(0,0,0,0.3); 
      border: 2px solid #2EA8E0; 
    }

const colores = {
  4: '#FF5722',
  6: '#4CAF50',
  8: '#FFC107',
  9: '#9C27B0'
};

const map = L.map('map').setView([-11.868, -77.125], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

let marcadores = [];

function dibujarMarcadores(redFiltro) {
  marcadores.forEach(m => map.removeLayer(m));
  marcadores = [];
  colegios.forEach(c => {
    if (redFiltro !== 'todas' && c.red !== parseInt(redFiltro)) return;
    const color = colores[c.red];
    const icono = L.divIcon({
      className: 'pin-personalizado',
      html: `<div style="width:26px;height:26px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.4);"></div>`,
      iconSize: [26,26],
      iconAnchor: [13,13]
    });
    let contenido = `<div class="popup-foto">
      <h4 style="margin:4px 0 8px 0; color:${color}; font-size: 1.15rem; border-bottom: 2px solid ${color}33; padding-bottom: 6px;">${c.nombre}</h4>
      <p><b>Red N° ${c.red}</b> · ${c.zona}</p>
      <p><b>Nivel:</b> ${c.niveles}</p>
      <p><b>Referencia:</b> ${c.referencia}</p>
      <p><b>Turnos:</b> ${c.turnos}</p>
      <p><b>Requisitos:</b> ${c.requisitos}</p>`;
    if (c.foto) {
      contenido += `<img src="${c.foto}" alt="Foto del colegio" />`;
    }
    contenido += `<p style="font-size:0.75rem; color:#666; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #ccc;">📍 ${c.lat}, ${c.lng}</p></div>`;
    const m = L.marker([c.lat, c.lng], {icon: icono}).addTo(map).bindPopup(contenido);
    marcadores.push(m);
  });
}

dibujarMarcadores('todas');

document.getElementById('filtroRed').addEventListener('change', e => {
  dibujarMarcadores(e.target.value);
});

document.getElementById('btnVerTodos').addEventListener('click', () => {
  document.getElementById('filtroRed').value = 'todas';
  dibujarMarcadores('todas');
  map.setView([-11.868, -77.125], 13);
});
