<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPACHE - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Desplazamiento nativo 100% libre para el gesto de actualizar */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        color: #ffffff;
        text-align: center;
    }

    .main-container { 
        width: 100%;
        max-width: 420px; 
        margin: 0 auto;
        padding: 15px 0 45px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
    }

    /* Header de Portada Ampliado */
    .header-portada {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        padding: 0 10px;
    }

    .imagen-portada {
        width: 100%;
        max-width: 400px; /* Aquí controlas qué tan grande se ve el ancho máximo */
        height: auto;
        max-height: 520px; /* Incrementado para que la portada luzca más grande y legible */
        object-fit: contain;
        image-rendering: -webkit-optimize-contrast;
        filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.6));
    }

    /* Bloque del Buscador y Botones (Con margen fluido) */
    .bloque-controles {
        width: 90%;
        max-width: 380px;
        margin-top: 15px; /* Espacio natural fluido debajo de la imagen grande */
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Buscador traslúcido */
    .input-busqueda {
        width: 100%;
        padding: 13px 16px;
        font-size: 13.5px;
        font-weight: 700;
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.92);
        color: #0f172a;
        box-sizing: border-box;
        outline: none;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 600; }
    .input-busqueda:focus { 
        border-color: #f59e0b; 
        box-shadow: 0 4px 18px rgba(245, 158, 11, 0.4); 
    }

    /* Grupo de Botones */
    .grupo-botones {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    /* Estilo Base para Relieve y Definición */
    .btn-opcion {
        width: 100%;
        padding: 13px 14px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(6px);
        letter-spacing: 0.3px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .btn-opcion:active { transform: scale(0.98); }

    /* 1. Ver Todos los Colegios: Ámbar Cálido */
    .btn-ambar {
        background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(217, 119, 6, 0.4);
    }

    /* 2. Redes Educativas: Azul Cobalto */
    .btn-cobalto {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }

    /* Fila dividida */
    .fila-botones-dividida {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .fila-botones-dividida .btn-opcion {
        flex: 1;
        padding: 12px 8px;
        font-size: 11.5px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 3. Colegios Estatales: Verde Esmeralda Vivo */
    .btn-esmeralda-vivo {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(5, 150, 105, 0.4);
    }

    /* 4. Colegios Particulares: Púrpura Violeta */
    .btn-violeta {
        background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(124, 58, 237, 0.4);
    }

    /* Marcas de agua */
    .marca-agua {
        position: fixed;
        bottom: 8px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 800;
        letter-spacing: 0.5px;
        user-select: none;
        pointer-events: none;
        z-index: 999;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    .marca-jdah { left: 15px; }
    .marca-jotitas { right: 15px; }

    /* Toast notification */
    .toast-notificacion {
        visibility: hidden;
        min-width: 140px;
        background-color: #a855f7;
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 18px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }

    /* Adaptación para PC */
    @media (min-width: 768px) {
        .bloque-controles {
            max-width: 420px;
        }

        .input-busqueda {
            padding: 15px;
            font-size: 14px;
        }

        .btn-opcion {
            padding: 15px;
            font-size: 14px;
        }

        .fila-botones-dividida .btn-opcion {
            font-size: 13px;
            padding: 14px 10px;
        }
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <header class="header-portada">
            <img src="portada.jpg" alt="MAPACHE - Ventanilla & Mi Perú" class="imagen-portada">
        </header>

        <div class="bloque-controles">
            <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

            <div class="grupo-botones">
                <button class="btn-opcion btn-ambar">🌐 Ver Todos los Colegios en el Mapa</button>
                <button class="btn-opcion btn-cobalto">🏫 Filtrar por Redes Educativas (1-9)</button>
                
                <div class="fila-botones-dividida">
                    <button class="btn-opcion btn-esmeralda-vivo">🏫 Colegios Estatales</button>
                    <button class="btn-opcion btn-violeta" onclick="lanzarToast()">🏫 Colegios Particulares</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
