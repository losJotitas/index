<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPACHE - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Configuración Global */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        background-color: #0f172a;
        background-image: url('portada.jpg');
        background-size: contain; /* En celular la imagen completa encaja sin recortarse */
        background-position: center top;
        background-repeat: no-repeat;
        color: #ffffff;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding: 15px 15px 25px 15px;
        box-sizing: border-box;
        position: relative;
    }

    /* Degradado sutil en la parte inferior para dar legibilidad a los botones */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0) 40%, rgba(15, 23, 42, 0.75) 75%, rgba(15, 23, 42, 0.95) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* Contenedor principal de controles */
    .main-container { 
        width: 100%;
        max-width: 380px; 
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 2;
        margin-bottom: 10px;
    }

    /* Buscador traslúcido y compacto */
    .input-busqueda {
        width: 100%;
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 700;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        background-color: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        box-sizing: border-box;
        margin-bottom: 10px;
        outline: none;
        text-align: center;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 600; }
    .input-busqueda:focus { 
        border-color: #ff7e36; 
        box-shadow: 0 4px 16px rgba(255, 126, 54, 0.5); 
    }

    /* Botones de Navegación Compactos */
    .grupo-botones {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .btn-opcion {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        font-size: 12.5px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
        background-color: rgba(2, 132, 199, 0.95);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(4px);
    }

    .btn-opcion:active { transform: scale(0.98); }

    .btn-destacado {
        background: linear-gradient(135deg, #ff7300 0%, #f95316 100%);
        box-shadow: 0 6px 18px rgba(249, 83, 22, 0.5);
    }

    /* Marcas de Agua integradas */
    .marca-agua {
        position: fixed;
        bottom: 8px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 800;
        letter-spacing: 0.5px;
        user-select: none;
        pointer-events: none;
        z-index: 999;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    .marca-jdah { left: 12px; }
    .marca-jotitas { right: 12px; }

    /* Toast "Próximamente" */
    .toast-notificacion {
        visibility: hidden;
        min-width: 140px;
        background-color: #a855f7;
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 18px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }

    /* AJUSTES ESPECÍFICOS PARA COMPUTADORA / PANTALLAS GRANDES */
    @media (min-width: 768px) {
        body {
            background-size: cover;
            justify-content: center;
            padding: 40px 20px;
        }

        .main-container {
            max-width: 420px;
            margin-top: 150px;
        }

        .input-busqueda {
            padding: 16px;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .grupo-botones {
            gap: 12px;
        }

        .btn-opcion {
            padding: 15px;
            font-size: 14px;
            border-radius: 18px;
        }
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

        <div class="grupo-botones">
            <button class="btn-opcion btn-destacado">🌐 Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion">🏫 Filtrar por Redes Educativas (1-9)</button>
            <button class="btn-opcion" onclick="lanzarToast()">🏫 Filtrar por Colegios Particulares</button>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
