<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UBIKTUCOLEYA! - Ventanilla & Mi Perú</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #06223F; color: #fff; }

    /* ========== PANTALLA PRINCIPAL ========== */
    .pantalla-principal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: linear-gradient(135deg, #06223F 0%, #0B3C73 100%);
      display: flex; flex-direction: column; align-items: center; z-index: 1000;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .pantalla-principal.oculta { opacity: 0; transform: translateY(-100%); pointer-events: none; }

    .logo-contenedor { margin-top: 6vh; text-align: center; }
    .logo-circulo {
      width: 140px; height: 140px; border-radius: 50%;
      background: linear-gradient(145deg, #FFD700, #FFA500);
      display: flex; align-items: center; justify-content: center; margin: 0 auto;
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
    }
    .logo-texto { font-size: 60px; }
    h1 {
      margin-top: 20px; font-size: 28px; color: #FFD700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .lema { font-size: 14px; color: #B0D0F0; margin-top: 6px; }

    .buscador-contenedor {
      margin-top: 30px; width: 90%; max-width: 450px; position: relative;
    }
    .buscador {
      width: 100%; padding: 14px 18px 14px 48px; border-radius: 50px; border: none;
      font-size: 16px; background: rgba(255,255,255,0.95); color: #06223F;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); outline: none;
    }
    .lupa {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 20px; color: #06223F;
    }
    .sugerencias {
      position: absolute; top: 52px; left: 0; right: 0;
      background: rgba(255,255,255,0.98); border-radius: 12px;
      max-height: 300px; overflow-y: auto; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .sugerencia {
      padding: 12px 18px; color: #06223F; cursor: pointer; border-bottom: 1px solid #eee;
    }
    .sugerencia:hover { background: #E8F0FC; }

    .redes-filtro {
      margin-top: 25px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      width: 90%; max-width: 500px;
    }
    .boton-red {
      padding: 8px 14px; border-radius: 20px; border: 1px solid #FFD700;
      background: rgba(255,215,0,0.15); color: #FFD700; font-size: 13px; cursor: pointer;
      transition: all 0.2s;
    }
    .boton-red.activo { background: #FFD700; color: #06223F; font-weight: bold; }

    .anuncios-lado-izq {
      position: absolute; left: 10px; top: 220px; width: 28%;
      background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px;
      font-size: 11px; color: #B0D0F0; max-height: 40vh; overflow-y: auto;
    }
    .boton-ver-todos {
      position: absolute; right: 15px; top: 220px; width: 26%;
      padding: 12px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #FFD700, #FFA500); color: #06223F;
      font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(255,215,0,0.3);
    }

    .sello-jdah { position: absolute; top: 10px; left: 12px; font-size: 13px; color: rgba(255,255,255,0.35); font-weight: bold; }
    .sello-jotitas { position: absolute; top: 10px; right: 12px; font-size: 13px; color: rgba(255,255,255,0.35); font-weight: bold; }

    /* ========== PANTALLA MAPA ========== */
    .pantalla-mapa {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      display: none; flex-direction: column; z-index: 500;
    }
    .cabecera-mapa {

    }

<!-- ==================================================
     LÓGICA DEL PROYECTO
     ================================================== -->
<script>
let mapa;
let marcadores = [];
let colegioSeleccionado = null;
let filtroActivo = "TODAS";

const pantallaPrincipal = document.getElementById('pantallaPrincipal');
const pantallaMapa = document.getElementById('pantallaMapa');
const buscador = document.getElementById('buscador');
const sugerencias = document.getElementById('sugerencias');
const ventanaInfo = document.getElementById('ventanaInfo');

// Inicializar mapa
function inicializarMapa() {
  mapa = L.map('mapa').setView([-11.84, -77.15], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(mapa);
  mapa.attributionControl.setPosition('bottomright');
}

// Crear marcador personalizado
function crearMarcador(colegio) {
  const icono = L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:#FFD700;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>`,
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
  const marcador = L.marker([colegio.lat, colegio.lng], { icon: icono }).addTo(mapa);
  marcador.colegio = colegio;
  marcador.on('click', () => mostrarInformacion(colegio));
  return marcador;
}

// Cargar todos los marcadores según filtro
function cargarMarcadores() {
  marcadores.forEach(m => mapa.removeLayer(m));
  marcadores = [];
  const lista = filtroActivo === "TODAS"
    ? colegios
    : colegios.filter(c => c.red.startsWith(filtroActivo));
  lista.forEach(c => marcadores.push(crearMarcador(c)));
}

// Mostrar información del colegio
function mostrarInformacion(colegio) {
  colegioSeleccionado = colegio;
  document.getElementById('infoNombre').textContent = colegio.nombre;
  document.getElementById('infoRed').textContent = colegio.red + ' · ' + colegio.zona;
  document.getElementById('infoNivel').textContent = colegio.nivel;
  document.getElementById('infoDireccion').textContent = colegio.direccion;
  document.getElementById('infoTurno').textContent = colegio.turno;
  document.getElementById('infoTaller').textContent = colegio.taller;
  document.getElementById('infoRequisitos').textContent = colegio.requisitos;

  const contenedorFoto = document.getElementById('contenedorFoto');
  const etiquetaFoto = document.getElementById('fotoColegio');
  if (colegio.foto && colegio.foto !== "") {
    etiquetaFoto.src = colegio.foto;
    etiquetaFoto.onload = () => { etiquetaFoto.style.display = 'block'; contenedorFoto.style.display = 'block'; };
    etiquetaFoto.onerror = () => { contenedorFoto.style.display = 'none'; };
  } else {
    contenedorFoto.style.display = 'none';
  }

  ventanaInfo.classList.add('mostrar');
}

// Buscar colegio
buscador.addEventListener('input', (e) => {
  const busqueda = e.target.value.trim().toLowerCase();
  sugerencias.innerHTML = '';
  ventanaInfo.classList.remove('mostrar');
  if (busqueda.length < 2) return;
  const coinciden = colegios.filter(c => c.nombre.toLowerCase().includes(busqueda));
  coinciden.forEach(c => {
    const div = document.createElement('div');
    div.className = 'sugerencia';
    div.textContent = c.nombre;
    div.addEventListener('click', () => {
      sugerencias.innerHTML = '';
      buscador.value = c.nombre;
      pantallaPrincipal.classList.add('oculta');
      pantallaMapa.style.display = 'flex';
      setTimeout(() => {
        if (!mapa) inicializarMapa();
        mapa.setView([c.lat, c.lng], 16);
        cargarMarcadores();
        setTimeout(() => mostrarInformacion(c), 300);
      }, 100);
    });
    sugerencias.appendChild(div);
  });
});

// Botón volver
document.getElementById('btnVolver').addEventListener('click', () => {
  pantallaPrincipal.classList.remove('oculta');
  pantallaMapa.style.display = 'none';
  ventanaInfo.classList.remove('mostrar');
  buscador.value = '';
  sugerencias.innerHTML = '';
  colegioSeleccionado = null;
});

// Cerrar ventana información
document.getElementById('btnCerrarInfo').addEventListener('click', () => {
  ventanaInfo.classList.remove('mostrar');
});

// Cerrar foto
document.getElementById('btnCerrarFoto').addEventListener('click', () => {
  document.getElementById('fotoColegio').style.display = 'none';
});

// Botones de ruta
document.getElementById('btnComoLlegar').addEventListener('click', () => {
  if (!colegioSeleccionado) return;
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${colegioSeleccionado.lat},${colegioSeleccionado.lng}`, '_blank');
});
document.getElementById('btnIniciarRuta').addEventListener('click', () => {
  if (!colegioSeleccionado) return;
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${colegioSeleccionado.lat},${colegioSeleccionado.lng}`, '_blank');
});
document.getElementById('btnCompartir').addEventListener('click', () => {
  if (!colegioSeleccionado) return;
  const enlace = `https://www.google.com/maps/search/?api=1&query=${colegioSeleccionado.lat},${colegioSeleccionado.lng}`;
  if (navigator.share) navigator.share({ title: colegioSeleccionado.nombre, url: enlace });
  else navigator.clipboard.writeText(enlace).then(() => alert('Enlace copiado al portapapeles'));
});

// Filtro por red
document.querySelectorAll('.boton-red').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.boton-red').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    filtroActivo = btn.dataset.red;
    if (pantallaMapa.style.display === 'flex') cargarMarcadores();
  });
});

// Ver todos los colegios
document.getElementById('btnVerTodos').addEventListener('click', () => {
  pantallaPrincipal.classList.add('oculta');
  pantallaMapa.style.display = 'flex';
  setTimeout(() => { if (!mapa) inicializarMapa(); cargarMarcadores(); mapa.setView([-11.84, -77.15], 13); }, 100);
});
</script>
