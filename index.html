<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBIKTUCOLEYA! - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Estilo Claro e Infantil/Escolar */
    body {
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 10px 15px 40px 15px;
        background: linear-gradient(180deg, #eef6ff 0%, #ffffff 100%);
        color: #1e293b;
        text-align: center;
        min-height: 100vh;
        box-sizing: border-box;
    }

    .main-container { 
        max-width: 420px; 
        margin: 0 auto; 
    }

    .header-portada {
        position: relative;
        width: 100%;
        margin-top: 5px;
        margin-bottom: 20px;
    }

    /* Nueva Imagen Principal sin cortes oscuros */
    .imagen-portada {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(2, 132, 199, 0.12);
    }

    /* Buscador Blanco Nítido */
    .input-busqueda {
        width: 100%;
        padding: 16px;
        font-size: 14px;
        font-weight: 600;
        border: 2px solid #e2e8f0;
        border-radius: 16px;
        background-color: #ffffff;
        color: #0f172a;
        box-sizing: border-box;
        margin-bottom: 20px;
        outline: none;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        transition: all 0.2s ease;
    }

    .input-busqueda::placeholder { color: #94a3b8; font-weight: 500; }
    .input-busqueda:focus { 
        border-color: #0284c7; 
        box-shadow: 0 4px 16px rgba(2, 132, 199, 0.2); 
    }

    /* Botones de Navegación Acomodados al Nuevo Estilo */
    .grupo-botones {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .btn-opcion {
        width: 100%;
        padding: 16px;
        border-radius: 16px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s;
        box-sizing: border-box;
        background-color: #0284c7; /* Azul fresco del mapa */
        color: #ffffff;
        border: none;
        box-shadow: 0 6px 16px rgba(2, 132, 199, 0.25);
    }

    .btn-opcion:active { transform: scale(0.98); }

    /* Botón destacado naranja para mayor jerarquía */
    .btn-destacado {
        background: linear-gradient(135deg, #ff7e36 0%, #f97316 100%);
        box-shadow: 0 6px 16px rgba(249, 115, 22, 0.35);
    }

    /* Marcas de Agua Discretas sobre fondo claro */
    .marca-agua {
        position: fixed;
        bottom: 12px;
        font-size: 11px;
        color: #64748b;
        opacity: 0.6;
        font-weight: 800;
        user-select: none;
        pointer-events: none;
        z-index: 999;
    }
    .marca-jdah { left: 15px; }
    .marca-jotitas { right: 15px; }

    /* Toast "Próximamente" */
    .toast-notificacion {
        visibility: hidden;
        min-width: 160px;
        background-color: #8b5cf6; /* Púrpura como en la tarjeta de Matrícula */
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 20px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 45px;
        transform: translateX(-50%);
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <header class="header-portada">
            <img src="portada.png" alt="UBIKTUCOLEYA! - Mapa Colegios" class="imagen-portada">
        </header>

        <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

        <div class="grupo-botones">
            <button class="btn-opcion btn-destacado">🌐 Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion">🏫 Filtrar por Redes Educativas (1-9)</button>
            <button class="btn-opcion" onclick="lanzarToast()">🏫 Filtrar por Colegios Particulares</button>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
