<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPACHE - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Estructura general */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #0b0f19 0%, #161e2e 50%, #070a10 100%);
        color: #ffffff;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .main-container { 
        width: 100%;
        max-width: 420px; 
        height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Portada de fondo */
    .header-portada {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 10px;
        box-sizing: border-box;
    }

    .imagen-portada {
        width: 100%;
        height: 85%;
        object-fit: contain;
        image-rendering: -webkit-optimize-contrast;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.6));
    }

    /* Capa traslúcida para integrar los controles sobre la ilustración */
    .main-container::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60vh;
        background: linear-gradient(180deg, rgba(11, 15, 25, 0) 0%, rgba(11, 15, 25, 0.88) 35%, rgba(11, 15, 25, 0.98) 100%);
        z-index: 2;
        pointer-events: none;
    }

    /* Bloque del Buscador y Botones Centrados */
    .bloque-controles {
        position: absolute;
        top: 62%;
        transform: translateY(-50%);
        width: 90%;
        max-width: 380px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Buscador traslúcido cristalino */
    .input-busqueda {
        width: 100%;
        padding: 13px 16px;
        font-size: 13.5px;
        font-weight: 700;
        border: 1.5px solid rgba(255, 255, 255, 0.85);
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        box-sizing: border-box;
        outline: none;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 600; }
    .input-busqueda:focus { 
        border-color: #d97706; 
        box-shadow: 0 4px 18px rgba(217, 119, 6, 0.4); 
    }

    /* Grupo de Botones */
    .grupo-botones {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    /* Estilo Base para Relieve y Elevación */
    .btn-opcion {
        width: 100%;
        padding: 13px 14px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-sizing: border-box;
        backdrop-filter: blur(6px);
        letter-spacing: 0.3px;
    }

    .btn-opcion:active { transform: scale(0.98); }

    /* 1. Botón Principal: Bronce / Ámbar Oscuro (Elegante y Sobrio) */
    .btn-bronce {
        background: linear-gradient(135deg, #b45309 0%, #78350f 100%);
        color: #fffbeb;
        border: 1px solid rgba(252, 211, 77, 0.35);
        box-shadow: 0 6px 18px rgba(180, 83, 9, 0.35);
    }

    /* 2. Botón Secundario: Azul Noche Profundo (Elegancia Clásica) */
    .btn-azul-noche {
        background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
        color: #eff6ff;
        border: 1px solid rgba(147, 197, 253, 0.35);
        box-shadow: 0 6px 18px rgba(30, 58, 138, 0.35);
    }

    /* Fila dividida en 2 botones de igual tamaño */
    .fila-botones-dividida {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .fila-botones-dividida .btn-opcion {
        flex: 1;
        padding: 12px 8px;
        font-size: 11.5px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 3. Colegios Estatales: Verde Esmeralda Oscuro (Sobrio y Profesional) */
    .btn-esmeralda {
        background: linear-gradient(135deg, #065f46 0%, #022c22 100%);
        color: #ecfdf5;
        border: 1px solid rgba(110, 231, 183, 0.35);
        box-shadow: 0 6px 18px rgba(6, 95, 70, 0.35);
    }

    /* 4. Colegios Particulares: Púrpura / Amatista Oscuro (Distinguido) */
    .btn-amatista {
        background: linear-gradient(135deg, #581c87 0%, #3b0764 100%);
        color: #faf5ff;
        border: 1px solid rgba(216, 180, 254, 0.35);
        box-shadow: 0 6px 18px rgba(88, 28, 135, 0.35);
    }

    /* Marcas de agua */
    .marca-agua {
        position: fixed;
        bottom: 8px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.75);
        font-weight: 800;
        letter-spacing: 0.5px;
        user-select: none;
        pointer-events: none;
        z-index: 999;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    .marca-jdah { left: 15px; }
    .marca-jotitas { right: 15px; }

    /* Toast notification */
    .toast-notificacion {
        visibility: hidden;
        min-width: 140px;
        background-color: #c084fc;
        color: #1e1b4b;
        text-align: center;
        border-radius: 20px;
        padding: 10px 18px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 6px 20px rgba(192, 132, 252, 0.5);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }

    /* Adaptación para PC */
    @media (min-width: 768px) {
        .bloque-controles {
            top: 58%;
            max-width: 420px;
        }

        .input-busqueda {
            padding: 15px;
            font-size: 14px;
        }

        .btn-opcion {
            padding: 15px;
            font-size: 14px;
        }

        .fila-botones-dividida .btn-opcion {
            font-size: 13px;
            padding: 14px 10px;
        }
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <header class="header-portada">
            <img src="portada.jpg" alt="MAPACHE - Ventanilla & Mi Perú" class="imagen-portada">
        </header>

        <div class="bloque-controles">
            <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

            <div class="grupo-botones">
                <button class="btn-opcion btn-bronce">🌐 Ver Todos los Colegios en el Mapa</button>
                <button class="btn-opcion btn-azul-noche">🏫 Filtrar por Redes Educativas (1-9)</button>
                
                <div class="fila-botones-dividida">
                    <button class="btn-opcion btn-esmeralda">🏫 Colegios Estatales</button>
                    <button class="btn-opcion btn-amatista" onclick="lanzarToast()">🏫 Colegios Particulares</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
