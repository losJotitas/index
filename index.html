<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPACHE - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Estructura para ajustar todo al alto exacto del celular sin scroll */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #1b0c36 0%, #3a506b 50%, #0f172a 100%);
        color: #ffffff;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .main-container { 
        width: 100%;
        max-width: 420px; 
        height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Portada abarcando la pantalla completa de fondo */
    .header-portada {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 10px;
        box-sizing: border-box;
    }

    .imagen-portada {
        width: 100%;
        height: 85%;
        object-fit: contain;
        image-rendering: -webkit-optimize-contrast;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
    }

    /* Capa traslúcida inferior para resaltar los botones sobre el mapa */
    .main-container::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60vh;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0) 0%, rgba(15, 23, 42, 0.85) 40%, rgba(15, 23, 42, 0.98) 100%);
        z-index: 2;
        pointer-events: none;
    }

    /* Bloque del Buscador y Botones Centrados */
    .bloque-controles {
        position: absolute;
        top: 62%;
        transform: translateY(-50%);
        width: 90%;
        max-width: 380px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Buscador traslúcido */
    .input-busqueda {
        width: 100%;
        padding: 13px 16px;
        font-size: 13.5px;
        font-weight: 700;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        box-sizing: border-box;
        outline: none;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 600; }
    .input-busqueda:focus { 
        border-color: #ff7e36; 
        box-shadow: 0 4px 18px rgba(255, 126, 54, 0.5); 
    }

    /* Botones de Navegación */
    .grupo-botones {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    .btn-opcion {
        width: 100%;
        padding: 13px 14px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
        background-color: rgba(2, 132, 199, 0.95);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(4px);
    }

    .btn-opcion:active { transform: scale(0.98); }

    .btn-destacado {
        background: linear-gradient(135deg, #ff7300 0%, #f95316 100%);
        box-shadow: 0 6px 18px rgba(249, 83, 22, 0.5);
    }

    /* Fila dividida en dos botones de 50% de ancho cada uno */
    .fila-botones-dividida {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .fila-botones-dividida .btn-opcion {
        flex: 1;
        padding: 12px 8px;
        font-size: 11.5px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Botón Rojo Conchevino (Izquierda) */
    .btn-estatales {
        background: linear-gradient(135deg, #700b1b 0%, #4a030f 100%);
        box-shadow: 0 6px 18px rgba(112, 11, 27, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #ffffff;
    }

    /* Botón Amarillo Oscuro (Derecha) */
    .btn-particulares {
        background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
        box-shadow: 0 6px 18px rgba(217, 119, 6, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #ffffff;
    }

    /* Marcas de Agua integradas */
    .marca-agua {
        position: fixed;
        bottom: 8px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 800;
        letter-spacing: 0.5px;
        user-select: none;
        pointer-events: none;
        z-index: 999;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    .marca-jdah { left: 15px; }
    .marca-jotitas { right: 15px; }

    /* Toast "Próximamente" */
    .toast-notificacion {
        visibility: hidden;
        min-width: 140px;
        background-color: #a855f7;
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 18px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }

    /* Adaptación para Pantallas Grandes / PC */
    @media (min-width: 768px) {
        .bloque-controles {
            top: 58%;
            max-width: 420px;
        }

        .input-busqueda {
            padding: 15px;
            font-size: 14px;
        }

        .btn-opcion {
            padding: 15px;
            font-size: 14px;
        }

        .fila-botones-dividida .btn-opcion {
            font-size: 13px;
            padding: 14px 10px;
        }
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <header class="header-portada">
            <img src="portada.jpg" alt="MAPACHE - Ventanilla & Mi Perú" class="imagen-portada">
        </header>

        <div class="bloque-controles">
            <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

            <div class="grupo-botones">
                <button class="btn-opcion btn-destacado">🌐 Ver Todos los Colegios en el Mapa</button>
                <button class="btn-opcion">🏫 Filtrar por Redes Educativas (1-9)</button>
                
                <!-- Fila dividida con Colegios Estatales (Izquierda) y Particulares (Derecha) -->
                <div class="fila-botones-dividida">
                    <button class="btn-opcion btn-estatales">🏫 Colegios Estatales</button>
                    <button class="btn-opcion btn-particulares" onclick="lanzarToast()">🏫 Colegios Particulares</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
