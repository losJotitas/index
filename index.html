<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAPACHE - Directorio Escolar Ventanilla & Mi Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Librería Lottie Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        
        html, body {
            width: 100vw;
            min-height: 100vh;
            min-height: 100dvh;
            color: #ffffff;
            background-color: #0f172a;
            overflow-y: auto; 
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }

        #pantalla-portada {
            position: relative;
            width: 100vw; 
            min-height: 100vh; 
            min-height: 100dvh;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fondo-portada {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .img-celular { display: block; width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .img-pc { display: none; width: 100%; height: 100%; object-fit: fill; position: absolute; top: 0; left: 0; }

        .main-container { 
            position: relative;
            z-index: 2;
            width: 100vw;
            max-width: 390px; 
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bloque-controles {
            width: 90%;                    
            max-width: 340px;              
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 23, 42, 0.88);
            padding: 16px;
            border-radius: 22px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.3); 
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
        }

        .input-busqueda {
            width: 100%;
            padding: 14px 16px;
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            font-weight: 500;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        .sugerencias-lista {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #ffffff;
            color: #0f172a;
            border-radius: 0 0 14px 14px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            z-index: 1000;
            max-height: 180px;
            overflow-y: auto;
            display: none;
        }

        .sugerencia-item {
            padding: 10px 14px;
            font-size: 12px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            font-weight: 500;
        }

        .sugerencia-item:hover, .sugerencia-item:active {
            background-color: #e2e8f0;
        }

        .btn-opcion {
            width: 100%;
            padding: 14px 16px;
            color: #ffffff;            
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-opcion:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .btn-verde { background-color: #729b79; box-shadow: 0 0 12px rgba(114, 155, 121, 0.4); }
        .btn-azul { background-color: #7b8db9; box-shadow: 0 0 12px rgba(123, 141, 185, 0.4); }
        .btn-estatales { background-color: #d18b6d; box-shadow: 0 0 12px rgba(209, 139, 109, 0.4); }
        .btn-particulares { background-color: #a8a697; color: #1e293b; box-shadow: 0 0 12px rgba(168, 166, 151, 0.4); }
        .fila-botones-dividida { display: flex; gap: 8px; width: 100%; }
        .fila-botones-dividida .btn-opcion { flex: 1; }

        #pantalla-mapa {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            flex-direction: column;
            z-index: 5;
            background-color: #f4f6f9;
        }

        .top-bar { background: #1a365d; color: white; padding: 10px 15px; display: flex; align-items: center; gap: 15px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-volver { background: #2b6cb0; border: 1px solid #4299e1; color: white; padding: 8px 15px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .search-container-map { flex: 1; position: relative; }
        .search-container-map input { width: 100%; padding: 10px 15px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.95rem; outline: none; background: #fff; color: #2d3748; }

        #map { flex: 1; width: 100%; }

        #mapachito-flotante {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 75px;
            height: 75px;
            background: rgba(30, 41, 59, 0.92);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
        #mapachito-flotante:hover { transform: scale(1.08); }
        .burbuja-ronquido {
            position: absolute;
            top: -22px;
            right: -5px;
            background: #ffffff;
            color: #0f172a;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        #modal-redes { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: rgba(11, 19, 36, 0.88); 
            z-index: 25000; 
            justify-content: center; 
            align-items: center; 
        }
        .modal-redes-content { 
            background: #1e293b; 
            width: 90%; 
            max-width: 380px; 
            border-radius: 20px; 
            border: 2px solid #38bdf8; 
            padding: 20px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.8); 
            max-height: 85vh; 
            overflow-y: auto; 
        }
        .modal-redes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .modal-redes-header h3 { color: #38bdf8; font-size: 1rem; }
        .redes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-red-item { padding: 12px; border-radius: 12px; border: none; color: white; font-weight: bold; font-size: 0.9rem; cursor: pointer; text-align: center; transition: transform 0.2s; }
        .btn-red-item:hover { transform: scale(1.03); filter: brightness(1.1); }

        .red-1 { background-color: #e53e3e; }
        .red-2 { background-color: #dd6b20; }
        .red-3 { background-color: #d69e2e; color: #1a202c; }
        .red-4 { background-color: #38a169; }
        .red-5 { background-color: #319795; }
        .red-6 { background-color: #3182ce; }
        .red-7 { background-color: #5a67d8; }
        .red-8 { background-color: #805ad5; }
        .red-9 { background-color: #d53f8c; }

        .pin-clasico-container { position: relative; width: 30px; height: 42px; }
        .pin-gota { position: absolute; top: 0; left: 0; width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.4); border: 2px solid #ffffff; }
        .pin-texto { position: absolute; top: 4px; left: 0; width: 30px; height: 30px; transform: rotate(0deg); color: #ffffff; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 19, 36, 0.92); z-index: 20002; justify-content: center; align-items: center; }
        .modal-content-comic { background: #1e293b; padding: 22px 18px; border-radius: 24px; border: 3px solid #38bdf8; text-align: center; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.9); max-width: 280px; width: 85%; display: flex; flex-direction: column; align-items: center; }
        .thought-bubble { position: relative; background: #ffffff; color: #0f172a; padding: 10px 16px; border-radius: 18px; font-weight: 700; font-size: 13px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); width: 100%; line-height: 1.4; }
        
        .raccoon-avatar-box { width: 110px; height: 110px; margin-bottom: 14px; background: #0f172a; border-radius: 50%; border: 3px solid #38bdf8; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .raccoon-avatar-box lottie-player { width: 100px; height: 100px; position: absolute; z-index: 2; }
        .mapache-fallback-emoji { font-size: 55px; position: absolute; z-index: 1; }

        .modal-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 10px 22px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }

        #modal-detalle { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 600px; max-height: 85vh; border-radius: 12px; overflow-y: auto; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; color: #2d3748; }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #a0aec0; }
        
        .btn-primary { background: #1a73e8; color: white; padding: 10px; text-decoration: none; text-align: center; border-radius: 6px; display: block; width: 100%; font-weight: bold; border: none; cursor: pointer; margin-bottom: 10px; }
        .btn-secundario { background: #4a5568; color: white; padding: 10px; text-decoration: none; text-align: center; border-radius: 6px; display: block; width: 100%; font-weight: bold; border: none; cursor: pointer; margin-bottom: 10px; }
        
        #modal-fachada-fullscreen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 30000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .fachada-fullscreen-img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(255,255,255,0.1);
        }
        .btn-cerrar-fachada {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            font-size: 1.8rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-cerrar-fachada:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .school-badge { display: inline-block; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 5px; }
        .badge-estatal { background: #ebf8ff; color: #3182ce; }
        .badge-particular { background: #faf5ff; color: #805ad5; }
        .semaforo-container { display: flex; gap: 6px; margin: 6px 0 10px 0; font-size: 0.8rem; flex-wrap: wrap; }
        .semaforo-tag { padding: 4px 8px; border-radius: 4px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .semaforo-activo { background: #def7ec; color: #03543f; border: 1px solid #bcf0da; }
        .semaforo-inactivo { background: #fdf2f2; color: #9b1c1c; border: 1px solid #f8d7da; }

        @media (min-width: 769px) {
            .img-celular { display: none; }
            .img-pc { display: block; }
        }
    </style>
</head>
<body>

    <!-- ================= PANTALLA 1: PORTADA ================= -->
    <div id="pantalla-portada">
        <div class="fondo-portada">
            <img src="portada-celular.jpg" alt="Portada Celular" class="img-celular">
            <img src="portada-pc.jpg" alt="Portada PC" class="img-pc">
        </div>

        <div class="main-container">
            <div class="bloque-controles">
                <div class="search-box-wrapper">
                    <input type="text" id="inputPortada" class="input-busqueda" placeholder="Buscar por nombre o número..." autocomplete="off">
                    <div id="sugerenciasPortada" class="sugerencias-lista"></div>
                </div>
                
                <button class="btn-opcion btn-verde" onclick="interactuarYEjecutar('todos')">Ver Todos los Colegios en el Mapa</button>
                <button class="btn-opcion btn-azul" onclick="abrirModalRedesConMapachito()">Filtrar por Redes Educativas (1-9)</button>
                
                <div class="fila-botones-dividida">
                    <button class="btn-opcion btn-estatales" onclick="interactuarYEjecutar('Estatal')">Colegios Estatales</button>
                    <button class="btn-opcion btn-particulares" onclick="interactuarYEjecutar('Particular')">Colegios Particulares</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= PANTALLA 2: MAPA ================= -->
    <div id="pantalla-mapa">
        <div class="top-bar">
            <button class="btn-volver" onclick="volverAPortada()">⬅ Volver</button>
            <div class="search-container-map">
                <input type="text" id="searchInputMap" placeholder="Filtrar colegios en el mapa..." autocomplete="off">
                <div id="sugerenciasMapa" class="sugerencias-lista"></div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- WIDGET FLOTANTE DE MAPACHITO -->
    <div id="mapachito-flotante" onclick="despertarMapachito()" title="¡Haz clic para despertar a Mapachito!">
        <div class="burbuja-ronquido">zzz... 🐾</div>
        <span style="font-size: 32px;">🦝💤</span>
    </div>

    <!-- ================= MODAL REDES EDUCATIVAS ================= -->
    <div id="modal-redes" onclick="cerrarModalRedes(event)">
        <div class="modal-redes-content" onclick="event.stopPropagation()">
            <div class="modal-redes-header">
                <h3>Selecciona una Red Educativa</h3>
                <span style="cursor:pointer; font-size:1.4rem; color:#a0aec0;" onclick="forzarCierreModalRedes()">&times;</span>
            </div>
            <div class="redes-grid">
                <button class="btn-red-item red-1" onclick="filtrarPorRedConMapachito(1)">Red 01</button>
                <button class="btn-red-item red-2" onclick="filtrarPorRedConMapachito(2)">Red 02</button>
                <button class="btn-red-item red-3" onclick="filtrarPorRedConMapachito(3)">Red 03</button>
                <button class="btn-red-item red-4" onclick="filtrarPorRedConMapachito(4)">Red 04</button>
                <button class="btn-red-item red-5" onclick="filtrarPorRedConMapachito(5)">Red 05</button>
                <button class="btn-red-item red-6" onclick="filtrarPorRedConMapachito(6)">Red 06</button>
                <button class="btn-red-item red-7" onclick="filtrarPorRedConMapachito(7)">Red 07</button>
                <button class="btn-red-item red-8" onclick="filtrarPorRedConMapachito(8)">Red 08</button>
                <button class="btn-red-item red-9" onclick="filtrarPorRedConMapachito(9)">Red 09</button>
            </div>
        </div>
    </div>

    <!-- Modal Reactivo de Mapachito -->
    <div id="modalMapachito" class="modal-overlay" onclick="cerrarModalMapachito()">
        <div class="modal-content-comic" onclick="event.stopPropagation()">
            <div id="textoMapachito" class="thought-bubble">¡Hola!</div>
            <div class="raccoon-avatar-box">
                <span class="mapache-fallback-emoji">🦝</span>
                <lottie-player id="animacionLottie" background="transparent" speed="1" style="width: 100%; height: 100%;" loop autoplay></lottie-player>
            </div>
            <button class="modal-btn" onclick="cerrarModalMapachito()">¡Entendido! 🚀</button>
        </div>
    </div>

    <!-- Modal Detalle Completo de Colegio -->
    <div id="modal-detalle">
        <div class="modal-content">
            <span class="modal-close" onclick="cerrarDetalle()">&times;</span>
            <div id="modal-body-content"></div>
        </div>
    </div>

    <!-- Visor de Fachada en Pantalla Completa -->
    <div id="modal-fachada-fullscreen">
        <button class="btn-cerrar-fachada" onclick="cerrarFachadaFullscreen()">&times;</button>
        <img id="imgFachadaFull" class="fachada-fullscreen-img" src="" alt="Fachada del Colegio">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="colegios.js"></script>
    <script>
        var map = L.map('map').setView([-11.875, -77.135], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        let marcadoresCreados = [];
        let accionPendiente = null;
        let temporizadorInactividad = null;

        function reiniciarTemporizadorInactividad() {
            const widgetDormido = document.getElementById('mapachito-flotante');
            if (widgetDormido) widgetDormido.style.display = 'none';

            if (temporizadorInactividad) clearTimeout(temporizadorInactividad);

            temporizadorInactividad = setTimeout(() => {
                if (widgetDormido) {
                    widgetDormido.style.display = 'flex';
                }
            }, 30000);
        }

        ['click', 'mousemove', 'keypress', 'touchstart', 'scroll'].forEach(evento => {
            window.addEventListener(evento, reiniciarTemporizadorInactividad, true);
        });

        const coloresRedes = {
            1: "#e53e3e", 2: "#dd6b20", 3: "#d69e2e", 4: "#38a169",
            5: "#319795", 6: "#3182ce", 7: "#5a67d8", 8: "#805ad5", 9: "#d53f8c"
        };

        function extraerNumeroRed(redStr) {
            if (!redStr) return null;
            const match = String(redStr).match(/\d+/);
            return match ? parseInt(match[0], 10) : null;
        }

        function mostrarColegiosEnMapa(lista) {
            marcadoresCreados.forEach(item => map.removeLayer(item.marker));
            marcadoresCreados = [];

            if (!lista || lista.length === 0) return;

            lista.forEach(colegio => {
                if (!colegio.latitud || !colegio.longitud) return;

                const numRed = extraerNumeroRed(colegio.red_educativa);
                const colorPin = (numRed && coloresRedes[numRed]) ? coloresRedes[numRed] : "#4a5568";
                const textoPin = numRed ? numRed : "🏫";

                const iconoClasico = L.divIcon({
                    className: 'custom-div-icon',
                    html: `
                        <div class="pin-clasico-container">
                            <div class="pin-gota" style="background-color: ${colorPin};"></div>
                            <div class="pin-texto">${textoPin}</div>
                        </div>
                    `,
                    iconSize: [30, 42],
                    iconAnchor: [15, 42],
                    popupAnchor: [0, -38]
                });

                var marker = L.marker([colegio.latitud, colegio.longitud], { icon: iconoClasico }).addTo(map);
                
                marker.bindPopup(`
                    <div style="min-width: 200px;">
                        <b style="font-size: 1rem; color: #1a365d;">${colegio.nombre_colegio}</b><br>
                        <span style="color: #4a5568;">Código: ${colegio.codigo || 'S/N'}</span><br>
                        <b>Tipo:</b> ${colegio.gestion}<br>
                        <b>Red Educativa:</b> ${colegio.red_educativa || 'No especificada'}<br>
                        <b>Dirección:</b> ${colegio.direccion || 'No especificada'}<br><br>
                        <button onclick="abrirDetalle('${colegio.nombre_colegio}')" style="background:#3182ce; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; width:100%; font-weight:bold;">Ver Detalle Completo</button>
                    </div>
                `);

                marcadoresCreados.push({ colegio, marker });
            });
        }

        function interactuarYEjecutar(tipoFiltro) {
            let mensaje = "¡Buscando colegios en el mapa para ti!";
            if (tipoFiltro === 'Estatal') {
                mensaje = "¡Excelente! Preparando el radar para ubicar todos los colegios Estatales de la zona. 🎒";
            } else if (tipoFiltro === 'Particular') {
                mensaje = "¡Muy well! Desplegando las opciones de colegios Particulares. 📝";
            } else {
                mensaje = "¡Genial! Alistando todo el directorio escolar de Ventanilla y Mi Perú. 🗺️";
            }

            accionPendiente = () => ejecutarIrAlMapa(tipoFiltro);
            abrirModalMapachito('buscando', mensaje);
        }

        function ejecutarIrAlMapa(filtroTipo) {
            document.getElementById('pantalla-portada').style.display = 'none';
            document.getElementById('pantalla-mapa').style.display = 'flex';
            setTimeout(() => { map.invalidateSize(); }, 200);

            let colegiosFiltrados = colegios;
            if (filtroTipo === 'Estatal' || filtroTipo === 'Particular') {
                colegiosFiltrados = colegios.filter(c => c.gestion && c.gestion.toLowerCase() === filtroTipo.toLowerCase());
            }

            mostrarColegiosEnMapa(colegiosFiltrados);
        }

        function abrirModalRedesConMapachito() {
            accionPendiente = () => {
                document.getElementById('modal-redes').style.display = 'flex';
            };
            abrirModalMapachito('pensando', "¡Las Redes Educativas organizan el distrito! ¿Cuál de las 9 deseas explorar? 🏫");
        }

        function cerrarModalRedes(e) {
            document.getElementById('modal-redes').style.display = 'none';
        }

        function forzarCierreModalRedes() {
            document.getElementById('modal-redes').style.display = 'none';
        }

        function filtrarPorRedConMapachito(numeroRed) {
            document.getElementById('modal-redes').style.display = 'none';
            accionPendiente = () => {
                document.getElementById('pantalla-portada').style.display = 'none';
                document.getElementById('pantalla-mapa').style.display = 'flex';
                setTimeout(() => { map.invalidateSize(); }, 200);

                const filtrados = colegios.filter(c => {
                    const num = extraerNumeroRed(c.red_educativa);
                    return num === numeroRed;
                });

                mostrarColegiosEnMapa(filtrados);

                if (filtrados.length > 0 && filtrados[0].latitud && filtrados[0].longitud) {
                    map.setView([filtrados[0].latitud, filtrados[0].longitud], 14);
                }
            };
            abrirModalMapachito('buscando', `¡Buscando colegios de la Red Educativa N° ${numeroRed}! 🔍`);
        }

        function volverAPortada() {
            document.getElementById('pantalla-mapa').style.display = 'none';
            document.getElementById('pantalla-portada').style.display = 'flex';
            document.getElementById('inputPortada').value = '';
            document.getElementById('sugerenciasPortada').style.display = 'none';
        }

        function configurarAutocompletado(inputId, listaId, alSeleccionar) {
            const input = document.getElementById(inputId);
            const lista = document.getElementById(listaId);

            input.addEventListener('input', function() {
                const texto = this.value.toLowerCase().trim();
                lista.innerHTML = '';
                if (texto.length === 0) {
                    lista.style.display = 'none';
                    return;
                }

                const coincidencias = colegios.filter(c => 
                    (c.nombre_colegio && c.nombre_colegio.toLowerCase().includes(texto)) || 
                    (c.codigo && c.codigo.toLowerCase().includes(texto))
                ).slice(0, 6);

                if (coincidencias.length === 0) {
                    lista.style.display = 'none';
                    return;
                }

                coincidencias.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'sugerencia-item';
                    div.innerHTML = `<b>${c.nombre_colegio}</b> <span style="color:#64748b;">(${c.codigo || 'S/N'})</span>`;
                    div.addEventListener('click', () => {
                        input.value = c.nombre_colegio;
                        lista.style.display = 'none';
                        input.blur();
                        alSeleccionar(c);
                    });
                    lista.appendChild(div);
                });
                lista.style.display = 'block';
            });

            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    lista.style.display = 'none';
                    input.blur();
                    const texto = this.value.toLowerCase().trim();
                    alSeleccionarPorTexto(texto);
                }
            });

            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !lista.contains(e.target)) {
                    lista.style.display = 'none';
                }
            });
        }

        configurarAutocompletado('inputPortada', 'sugerenciasPortada', function(colegioSeleccionado) {
            accionPendiente = () => {
                document.getElementById('pantalla-portada').style.display = 'none';
                document.getElementById('pantalla-mapa').style.display = 'flex';
                setTimeout(() => { map.invalidateSize(); }, 200);
                mostrarColegiosEnMapa([colegioSeleccionado]);
                if (colegioSeleccionado.latitud && colegioSeleccionado.longitud) {
                    map.setView([colegioSeleccionado.latitud, colegioSeleccionado.longitud], 16);
                }
            };
            abrirModalMapachito('buscando', `¡Encontré al colegio ${colegioSeleccionado.nombre_colegio}! Te llevo directo. 🎯`);
        });

        function alSeleccionarPorTexto(texto) {
            accionPendiente = () => {
                document.getElementById('pantalla-portada').style.display = 'none';
                document.getElementById('pantalla-mapa').style.display = 'flex';
                setTimeout(() => { map.invalidateSize(); }, 200);

                const filtrados = colegios.filter(c => 
                    (c.nombre_colegio && c.nombre_colegio.toLowerCase().includes(texto)) || 
                    (c.codigo && c.codigo.toLowerCase().includes(texto))
                );
                mostrarColegiosEnMapa(filtrados);
                document.getElementById('searchInputMap').value = texto;
                if (filtrados.length > 0 && filtrados[0].latitud && filtrados[0].longitud) {
                    map.setView([filtrados[0].latitud, filtrados[0].longitud], 14);
                }
            };
            abrirModalMapachito('buscando', `¡Rastreando coincidencias para "${texto}" con mi olfato de mapache! 🕵️‍♂️`);
        }

        const inputBuscadorMapa = document.getElementById('searchInputMap');
        const listaMapa = document.getElementById('sugerenciasMapa');
        
        inputBuscadorMapa.addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase().trim();
            listaMapa.innerHTML = '';
            if (texto.length === 0) {
                listaMapa.style.display = 'none';
                mostrarColegiosEnMapa(colegios);
                return;
            }

            const filtrados = colegios.filter(c => 
                (c.nombre_colegio && c.nombre_colegio.toLowerCase().includes(texto)) || 
                (c.distrito && c.distrito.toLowerCase().includes(texto)) ||
                (c.codigo && c.codigo.toLowerCase().includes(texto))
            );

            mostrarColegiosEnMapa(filtrados);
            if (filtrados.length > 0 && filtrados[0].latitud && filtrados[0].longitud) {
                map.setView([filtrados[0].latitud, filtrados[0].longitud], 14);
            }

            filtrados.slice(0, 5).forEach(c => {
                const div = document.createElement('div');
                div.className = 'sugerencia-item';
                div.innerHTML = `<b>${c.nombre_colegio}</b>`;
                div.addEventListener('click', () => {
                    inputBuscadorMapa.value = c.nombre_colegio;
                    listaMapa.style.display = 'none';
                    inputBuscadorMapa.blur();
                    mostrarColegiosEnMapa([c]);
                    if (c.latitud && c.longitud) map.setView([c.latitud, c.longitud], 16);
                });
                listaMapa.appendChild(div);
            });
            listaMapa.style.display = 'block';
        });

        inputBuscadorMapa.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                listaMapa.style.display = 'none';
                inputBuscadorMapa.blur();
            }
        });

        function obtenerRutaFoto(nombreColegio) {
            const numerosMatch = nombreColegio.match(/\d+/);
            if (!numerosMatch) return null;
            const num = numerosMatch[0];
            const fotos = {
                "107": "fotos/107_Los_Pastorcitos_de_Fatima.jpeg", "113": "fotos/113_Domingo_Savio.jpeg",
                "125": "fotos/125_Divino_Nino_Jesus.jpeg", "133": "fotos/133_Divina_Pastora.jpeg",
                "135": "fotos/135_Mi_Pequeno_Mundo.jpeg", "141": "fotos/141_Inmaculada_Virgen_de_Guadalupe.jpeg",
                "167": "fotos/167_Cristo_Rey_de_los_Ninos.jpeg", "5090": "fotos/5090_Antonia_Moreno_de_Caceres.jpeg",
                "5091": "fotos/5091_Hijos_de_Grau.jpeg", "5093": "fotos/5093_Antonio_Raymondi.jpeg",
                "5119": "fotos/5119_Villa_Emilia.jpeg", "5147": "fotos/5147_Santa_Rosa_de_Lima.jpeg",
                "5151": "fotos/5151_San_Juan_Bosco.jpeg"
            };
            return fotos[num] || null;
        }

        function abrirDetalle(nombreColegio) {
            const colegio = colegios.find(c => c.nombre_colegio === nombreColegio);
            if (!colegio) return;

            const modal = document.getElementById('modal-detalle');
            const contenido = document.getElementById('modal-body-content');
            
            const botonFachadaHtml = `
                <button onclick="intentarVerFachada('${colegio.nombre_colegio}')" class="btn-secundario">
                    🏫 Fachada del Colegio
                </button>
            `;

            const nivelesTexto = (colegio.NIVELES || colegio.niveles || '').toLowerCase();
            const tieneCuna = nivelesTexto.includes("cuna");
            const tieneInicial = nivelesTexto.includes("inicial");
            const tienePrimaria = nivelesTexto.includes("primaria");
            const tieneSecundaria = nivelesTexto.includes("secundaria");

            let htmlSemaforo = `
                <span class="semaforo-tag ${tieneCuna ? 'semaforo-activo' : 'semaforo-inactivo'}">${tieneCuna ? '🟢' : '🔴'} Cuna</span>
                <span class="semaforo-tag ${tieneInicial ? 'semaforo-activo' : 'semaforo-inactivo'}">${tieneInicial ? '🟢' : '🔴'} Inicial</span>
                <span class="semaforo-tag ${tienePrimaria ? 'semaforo-activo' : 'semaforo-inactivo'}">${tienePrimaria ? '🟢' : '🔴'} Primaria</span>
                <span class="semaforo-tag ${tieneSecundaria ? 'semaforo-activo' : 'semaforo-inactivo'}">${tieneSecundaria ? '🟢' : '🔴'} Secundaria</span>
            `;

            contenido.innerHTML = `
                <div class="modal-header">
                    <span class="school-badge ${colegio.gestion === 'Estatal' ? 'badge-estatal' : 'badge-particular'}">${colegio.gestion}</span>
                    <h2 style="font-size: 1.2rem; color: #1a365d; margin-top: 5px;">${colegio.nombre_colegio}</h2>
                </div>
                <div class="modal-body" style="margin-top: 10px;">
                    <p>📍 <b>Dirección:</b> ${colegio.direccion || 'No especificada'}</p>
                    <p>🏙️ <b>Distrito:</b> ${colegio.distrito || 'Ventanilla'} &nbsp;|&nbsp; 🏫 <b>Red Educativa:</b> ${colegio.red_educativa || 'No especificada'}</p>
                    <p style="margin-top: 8px;">📚 <b>Niveles:</b></p>
                    <div class="semaforo-container">${htmlSemaforo}</div>
                    <p style="margin-top: 8px;">📋 <b>Requisitos para Matrícula:</b> ${colegio.requisitos_de_matricula || 'Consultar en la institución.'}</p>
                </div>
                <div style="margin-top: 20px;">
                    ${botonFachadaHtml}
                    <button onclick="explorarMapaGoogle(${colegio.latitud}, ${colegio.longitud})" class="btn-primary">
                        🗺️ Explorar mapa ➔
                    </button>
                    <button onclick="iniciarViajeGoogle(${colegio.latitud}, ${colegio.longitud})" class="btn-primary" style="background: #188038;">
                        🧭 Iniciar Viaje ➢
                    </button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        function cerrarDetalle() { document.getElementById('modal-detalle').style.display = 'none'; }

        function intentarVerFachada(nombreColegio) {
            const ruta = obtenerRutaFoto(nombreColegio);
            if (ruta) {
                const modalFull = document.getElementById('modal-fachada-fullscreen');
                const imgFull = document.getElementById('imgFachadaFull');
                imgFull.src = ruta;
                modalFull.style.display = 'flex';
            } else {
                abrirModalMapachito('pensando', "Pronto se agregara la foto de la fachada del colegio");
            }
        }

        function cerrarFachadaFullscreen() {
            document.getElementById('modal-fachada-fullscreen').style.display = 'none';
        }

        function explorarMapaGoogle(lat, lng) {
            // Equivalente a ver la ubicación en Google Maps (Explorar/Cómo llegar general)
            window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, '_blank');
        }

        function iniciarViajeGoogle(lat, lng) {
            // Activa la ruta guiada paso a paso desde la ubicación actual (Estilo Navegación Google Maps)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        window.open(`https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${lat},${lng}&travelmode=driving`, '_blank');
                    },
                    () => {
                        window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`, '_blank');
                    }
                );
            } else {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`, '_blank');
            }
        }

        const modalMapachitoEl = document.getElementById('modalMapachito');
        const textoMapachitoEl = document.getElementById('textoMapachito');
        const animacionLottieEl = document.getElementById('animacionLottie');

        function abrirModalMapachito(estado, mensajePersonalizado) {
            let archivoJson = 'mapache_saludando.json';
            if (estado === 'buscando') {
                archivoJson = 'mapache_buscando.json';
            } else if (estado === 'pensando') {
                archivoJson = 'mapache_pensando.json';
            }

            animacionLottieEl.load(archivoJson);
            textoMapachitoEl.innerText = mensajePersonalizado;
            modalMapachitoEl.style.display = 'flex';
        }

        function cerrarModalMapachito() {
            modalMapachitoEl.style.display = 'none';
            if (accionPendiente) {
                const fn = accionPendiente;
                accionPendiente = null;
                fn();
            }
        }

        function despertarMapachito() {
            document.getElementById('mapachito-flotante').style.display = 'none';
            abrirModalMapachito('pensando', "¡Zzz... Ah, hola! Estaba soñando con galletas de mapache. ¿En qué te ayudo a explorar el mapa?");
        }
    </script>
</body>
</html>
