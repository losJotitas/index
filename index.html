<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPACHE - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Estructura para abarcar el 100% de la pantalla */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #1b0c36 0%, #3a506b 50%, #0f172a 100%);
        color: #ffffff;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 8px 12px 20px 12px;
        box-sizing: border-box;
    }

    .main-container { 
        width: 100%;
        max-width: 440px; 
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
    }

    /* Portada Grande: Ocupa el 62% del alto de la pantalla */
    .header-portada {
        width: 100%;
        height: 62vh;
        max-height: 500px;
        margin-top: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* La imagen escala al máximo sin salirse ni distorsionarse */
    .imagen-portada {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 20px;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.45));
        image-rendering: -webkit-optimize-contrast;
    }

    /* Bloque de Controles Elevado (Sube hacia la portada con margen negativo) */
    .bloque-controles {
        width: 100%;
        margin-top: -35px; /* Subimos el buscador y botones sobre la base de la portada */
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    /* Buscador traslúcido elevado */
    .input-busqueda {
        width: 100%;
        padding: 12px 16px;
        font-size: 13.5px;
        font-weight: 700;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        box-sizing: border-box;
        outline: none;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 600; }
    .input-busqueda:focus { 
        border-color: #ff7e36; 
        box-shadow: 0 4px 18px rgba(255, 126, 54, 0.5); 
    }

    /* Botones Elevados y Visibles */
    .grupo-botones {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .btn-opcion {
        width: 100%;
        padding: 12px 14px;
        border-radius: 15px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
        background-color: rgba(2, 132, 199, 0.95);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(4px);
    }

    .btn-opcion:active { transform: scale(0.98); }

    .btn-destacado {
        background: linear-gradient(135deg, #ff7300 0%, #f95316 100%);
        box-shadow: 0 6px 18px rgba(249, 83, 22, 0.5);
    }

    /* Marcas de Agua integradas */
    .marca-agua {
        position: fixed;
        bottom: 6px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 800;
        letter-spacing: 0.5px;
        user-select: none;
        pointer-events: none;
        z-index: 999;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    .marca-jdah { left: 12px; }
    .marca-jotitas { right: 12px; }

    /* Toast "Próximamente" */
    .toast-notificacion {
        visibility: hidden;
        min-width: 140px;
        background-color: #a855f7;
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 18px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }

    /* Adaptación para PC / Pantallas Grandes */
    @media (min-width: 768px) {
        body {
            justify-content: center;
        }

        .main-container {
            max-width: 460px;
            height: auto;
        }

        .header-portada {
            height: 52vh;
            max-height: 460px;
        }

        .bloque-controles {
            margin-top: -40px;
        }

        .input-busqueda {
            padding: 14px;
            font-size: 14px;
        }

        .btn-opcion {
            padding: 14px;
            font-size: 14px;
        }
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <header class="header-portada">
            <img src="portada.jpg" alt="MAPACHE - Ventanilla & Mi Perú" class="imagen-portada">
        </header>

        <div class="bloque-controles">
            <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

            <div class="grupo-botones">
                <button class="btn-opcion btn-destacado">🌐 Ver Todos los Colegios en el Mapa</button>
                <button class="btn-opcion">🏫 Filtrar por Redes Educativas (1-9)</button>
                <button class="btn-opcion" onclick="lanzarToast()">🏫 Filtrar por Colegios Particulares</button>
            </div>
        </div>

    </div>

    <!-- Toast oculto -->
    <div id="toast" class="toast-notificacion">Próximamente</div>

    <!-- Marcas de agua -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
