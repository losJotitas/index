<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBIKTUCOLEYA! - Ventanilla & Mi Perú</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    /* Estructura Base con Imagen de Fondo */
    body {
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 20px 15px 40px 15px;
        background-color: #f0f7ff;
        /* Usa tu nueva imagen como fondo de pantalla */
        background-image: url('portada.png');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        color: #1e293b;
        text-align: center;
        min-height: 100vh;
        box-sizing: border-box;
        position: relative;
    }

    /* Capa translúcida para recortar bordes y dar legibilidad a tus botones */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(4px); /* Suaviza los detalles del fondo */
        z-index: 1;
    }

    .main-container { 
        max-width: 420px; 
        margin: 0 auto; 
        position: relative;
        z-index: 2; /* Mantiene la interfaz por encima del fondo */
    }

    /* Título Adaptado */
    .titulo-app {
        font-size: 24px;
        font-weight: 900;
        color: #0284c7;
        margin-top: 20px;
        margin-bottom: 5px;
        text-shadow: 0 2px 8px rgba(255, 255, 255, 0.8);
    }

    .subtitulo-app {
        font-size: 13px;
        font-weight: 700;
        color: #475569;
        margin-bottom: 35px;
    }

    /* Buscador Blanco con sombra realzada */
    .input-busqueda {
        width: 100%;
        padding: 16px;
        font-size: 14px;
        font-weight: 600;
        border: 2px solid #ffffff;
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        box-sizing: border-box;
        margin-bottom: 20px;
        outline: none;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .input-busqueda::placeholder { color: #64748b; font-weight: 500; }

    /* Botones de Navegación */
    .grupo-botones {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .btn-opcion {
        width: 100%;
        padding: 16px;
        border-radius: 16px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s;
        box-sizing: border-box;
        background-color: #0284c7;
        color: #ffffff;
        border: none;
        box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
    }

    .btn-opcion:active { transform: scale(0.98); }

    .btn-destacado {
        background: linear-gradient(135deg, #ff7e36 0%, #f97316 100%);
        box-shadow: 0 6px 18px rgba(249, 115, 22, 0.4);
    }

    /* Marcas de Agua */
    .marca-agua {
        position: fixed;
        bottom: 12px;
        font-size: 11px;
        color: #334155;
        font-weight: 900;
        user-select: none;
        pointer-events: none;
        z-index: 999;
    }
    .marca-jdah { left: 15px; }
    .marca-jotitas { right: 15px; }

    /* Toast "Próximamente" */
    .toast-notificacion {
        visibility: hidden;
        min-width: 160px;
        background-color: #8b5cf6;
        color: #ffffff;
        text-align: center;
        border-radius: 20px;
        padding: 10px 20px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 45px;
        transform: translateX(-50%);
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        opacity: 0;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .toast-notificacion.visible {
        visibility: visible;
        opacity: 1;
    }
</style>
</head>
<body>

    <div class="main-container">
        
        <div class="titulo-app">UBIKTUCOLEYA!</div>
        <div class="subtitulo-app">Ventanilla & Mi Perú</div>

        <input type="text" class="input-busqueda" placeholder="🔍 Buscar por nombre o número...">

        <div class="grupo-botones">
            <button class="btn-opcion btn-destacado">🌐 Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion">🏫 Filtrar por Redes Educativas (1-9)</button>
            <button class="btn-opcion" onclick="lanzarToast()">🏫 Filtrar por Colegios Particulares</button>
        </div>

    </div>

    <div id="toast" class="toast-notificacion">Próximamente</div>

    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <script>
        function lanzarToast() {
            var toast = document.getElementById("toast");
            toast.classList.add("visible");
            setTimeout(function(){ 
                toast.classList.remove("visible"); 
            }, 2500);
        }
    </script>

</body>
</html>
