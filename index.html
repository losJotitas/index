<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBIKTUCOLEYA! - Ventanilla & Mi Perú</title>
    <style>
        /* Estilos Generales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }

        /* Marcas de agua discretas */
        .marca-agua {
            position: absolute;
            top: 10px;
            font-size: 11px;
            color: #e0e0e0; /* Gris ultra claro casi invisible */
            font-weight: bold;
            user-select: none;
        }
        .marca-jdah { left: 15px; }
        .marca-jotitas { right: 15px; }

        /* Contenedor del Logo y Títulos */
        .header-app {
            margin-top: 30px;
            margin-bottom: 25px;
        }
        .logo-container {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1.titulo-app {
            font-size: 28px;
            color: #1a365d;
            margin: 5px 0;
            font-weight: 800;
        }
        h2.subtitulo-app {
            font-size: 16px;
            color: #4a5568;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }
        p.lema-app {
            font-size: 14px;
            color: #718096;
            font-style: italic;
            margin: 0;
        }

        /* Sección de Búsqueda y Botones */
        .main-container {
            max-width: 480px;
            margin: 0 auto;
        }
        .input-busqueda {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        .input-busqueda:focus {
            border-color: #3182ce;
        }

        /* Grupo de Botones de Exploración */
        .grupo-botones {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-principal {
            background-color: #2b6cb0;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-secundario {
            background-color: #2c7a7b;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-principal:hover { background-color: #2c5282; }
        .btn-secundario:hover { background-color: #234e52; }

        /* Banner de Noticias/Anuncios */
        .banner-anuncios {
            background-color: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 10px;
            padding: 15px;
            font-size: 13px;
            color: #2c5282;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Marcas de Agua Sutiles -->
    <span class="marca-agua marca-jdah">JDAH</span>
    <span class="marca-agua marca-jotitas">LOS JOTITAS</span>

    <div class="main-container">
        
        <!-- Identidad Corporativa -->
        <header class="header-app">
            <div class="logo-container">🏠🎓</div>
            <h1 class="titulo-app">UBIKTUCOLEYA!</h1>
            <h2 class="subtitulo-app">VENTANILLA & MI PERÚ</h2>
            <p class="lema-app">"Tu cole a un mapa de distancia"</p>
        </header>

        <!-- Buscador Principal -->
        <section>
            <input type="text" class="input-busqueda" placeholder="🔍 Busca por nombre o número de colegio...">
        </section>

        <!-- Botones de Navegación Directa -->
        <section class="grupo-botones">
            <button class="btn-principal">🌐 Ver Todos los Colegios</button>
            <button class="btn-secundario">🏫 Filtrar por Redes Educativas (1-9)</button>
        </section>

        <!-- Banner de Comunicados y Publicidad -->
        <aside class="banner-anuncios">
            <strong>📢 Comunicado Oficial:</strong> Revisa el estado de vacantes del proceso de matrícula escolar para el período actual.
        </aside>

    </div>

</body>
</html>
