<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAPACHE - Ventanilla & Mi Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Librería Lottie Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    
    <!-- Librería Leaflet para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 1. Configuración general */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: #0f172a;
            overflow: hidden; 
            overscroll-behavior-y: none; 
        }

        /* Sistema de Vistas (Pantallas) */
        .vista {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: none;
            z-index: 1;
        }

        .vista.activa {
            display: flex;
            z-index: 10;
        }

        /* --- VISTA 1: PORTADA PRINCIPAL --- */
        .fondo-portada {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            pointer-events: none; 
            overflow: hidden;
        }

        .img-celular, .img-pc {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; 
            left: 0;
        }
        .img-pc { display: none; }

        .main-container { 
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 2;
            max-width: 390px; 
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .bloque-controles {
            width: 90%;                    
            max-width: 340px;              
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 23, 42, 0.88);
            padding: 16px;
            border-radius: 22px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.3); 
            box-sizing: border-box;
        }

        .input-busqueda {
            width: 100%;
            padding: 14px 16px;
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        .btn-opcion {
            width: 100%;
            padding: 14px 16px;
            color: #ffffff;           
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-opcion:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .btn-verde { background-color: #729b79; box-shadow: 0 0 12px rgba(114, 155, 121, 0.4); }
        .btn-azul { background-color: #7b8db9; box-shadow: 0 0 12px rgba(123, 141, 185, 0.4); }
        .btn-estatales { background-color: #d18b6d; box-shadow: 0 0 12px rgba(209, 139, 109, 0.4); }
        .btn-particulares { background-color: #a8a697; color: #1e293b; box-shadow: 0 0 12px rgba(168, 166, 151, 0.4); }

        .fila-botones-dividida {
            display: flex; 
            gap: 8px; 
            width: 100%;
        }

        .fila-botones-dividida .btn-opcion {
            flex: 1; 
        }

        /* --- VISTA 2: SEGUNDA PANTALLA (MAPA) --- */
        #vista-mapa {
            flex-direction: column;
        }

        .header-mapa {
            background: #0f172a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            z-index: 1000;
        }

        .btn-volver {
            background: #1e293b;
            color: white;
            border: 2px solid #38bdf8;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }

        .input-mapa-busqueda {
            flex: 1;
            padding: 10px 14px;
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
        }

        #mapa-container {
            width: 100vw;
            flex: 1;
        }

        /* --- VENTANA MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 19, 36, 0.92);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .modal-content-comic {
            background: #1e293b; 
            padding: 24px 20px;
            border-radius: 24px;
            border: 3px solid #38bdf8; 
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.9);
            max-width: 290px;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: entradaSolida 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes entradaSolida {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .thought-bubble {
            position: relative;
            background: #ffffff;
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            width: 85%;
            box-sizing: border-box;
        }

        .thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
        }

        .raccoon-lottie-container {
            width: 140px;
            height: 160px;
            margin-bottom: 16px;
            background: #ffffff; 
            border-radius: 16px;  
            border: 2px solid #cbd5e1; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .modal-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .modal-btn:hover { transform: scale(1.05); }

        /* Media query PC */
        @media (min-width: 769px) {
            .img-celular { display: none; }
            .img-pc { display: block; }
            .main-container { max-width: 1000px; padding-top: 50px; }
            .bloque-controles { width: 100%; max-width: 480px; padding: 20px 24px; }
        }
    </style>
</head>
<body>

    <!-- ================= VISTA 1: PORTADA PRINCIPAL ================= -->
    <div id="vista-portada" class="vista activa">
        <div class="fondo-portada">
            <img src="portada-celular.jpg" alt="Portada Celular" class="img-celular">
            <img src="portada-pc.jpg" alt="Portada PC" class="img-pc">
        </div>

        <div class="main-container">
            <div class="bloque-controles">
                <!-- Buscador principal -->
                <input type="text" id="inputBuscadorPrincipal" class="input-busqueda" placeholder="Buscar por nombre o número..." onkeypress="handleBusquedaPrincipal(event)">
                
                <!-- Botones que activan modal primero o van directamente al mapa con filtro -->
                <button class="btn-opcion btn-verde" onclick="ejecutarAccionBoton('todos')">Ver Todos los Colegios en el Mapa</button>
                <button class="btn-opcion btn-azul" onclick="ejecutarAccionBoton('redes')">Filtrar por Redes Educativas (1-9)</button>
                
                <div class="fila-botones-dividida">
                    <button class="btn-opcion btn-estatales" onclick="ejecutarAccionBoton('estatales')">Colegios Estatales</button>
                    <button class="btn-opcion btn-particulares" onclick="ejecutarAccionBoton('particulares')">Colegios Particulares</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= VISTA 2: SEGUNDA PANTALLA (MAPA) ================= -->
    <div id="vista-mapa" class="vista">
        <div class="header-mapa">
            <button class="btn-volver" onclick="volverAPortada()">⬅ Volver</button>
            <input type="text" id="inputBuscadorMapa" class="input-mapa-busqueda" placeholder="Filtrar colegios en el mapa..." oninput="filtrarColegiosMapa()">
        </div>
        <div id="mapa-container"></div>
    </div>

    <!-- ================= MODAL DE MAPACHITO ================= -->
    <div id="modalMapachito" class="modal-overlay" onclick="cerrarModalMapachito()">
        <div class="modal-content-comic" onclick="event.stopPropagation()">
            <div id="textoMapachito" class="thought-bubble">¡Hola!</div>
            <div class="raccoon-lottie-container">
                <lottie-player id="animacionLottie" background="transparent" speed="1" style="width: 100%; height: 100%;" loop autoplay></lottie-player>
            </div>
            <button class="modal-btn" onclick="cerrarModalMapachito()">Aceptar</button>
        </div>
    </div>

    <!-- ================= LÓGICA DE JAVASCRIPT ================= -->
    <script>
        const modalEl = document.getElementById('modalMapachito');
        const textoEl = document.getElementById('textoMapachito');
        const animacionEl = document.getElementById('animacionLottie');
        
        let tiempoInactividad;
        const SEGUNDOS_PARA_DORMIR = 30;
        let mapa = null;
        let marcadoresLayer = null;

        // Base de datos de ejemplo (Puedes reemplazarla o adaptarla con tus colegios reales de Ventanilla y Mi Perú)
        const colegiosData = [
            { id: 1, nombre: "Colegio Nacional Ventanilla", tipo: "estatal", red: "Red 1", lat: -11.8700, lng: -77.1250, codigo: "001", direccion: "Av. La Playa s/n" },
            { id: 2, nombre: "Colegio Mi Perú 5127", tipo: "estatal", red: "Red 3", lat: -11.8550, lng: -77.1100, codigo: "002", direccion: "Sector K Mi Perú" },
            { id: 3, nombre: "Colegio Particular Divino Maestro", tipo: "particular", red: "Red 2", lat: -11.8650, lng: -77.1350, codigo: "003", direccion: "Calle Los Rosales 120" },
            { id: 4, nombre: "Colegio San Pedro Ventanilla", tipo: "estatal", red: "Red 4", lat: -11.8800, lng: -77.1400, codigo: "004", direccion: "Asoc. Pro Vivienda" },
            { id: 5, nombre: "Colegio Particular Santa Rosa", tipo: "particular", red: "Red 5", lat: -11.8500, lng: -77.1200, codigo: "005", direccion: "Av. Principal Mi Perú" }
        ];

        let filtroActualGlobal = 'todos';

        function abrirModalMapachito(estado, callbackAccion) {
            reiniciarTemporizadorInactividad();
            let archivoJson = '';
            let textoMensaje = '';

            switch (estado) {
                case 'saludando':
                    archivoJson = 'mapache_saludando.json';
                    textoMensaje = '¡Hola! Bienvenidos a Ventanilla y Mi Perú.';
                    break;
                case 'feliz':
                    archivoJson = 'mapache_feliz.json';
                    textoMensaje = '¡Excelente! Mostrando Colegios Estatales.';
                    break;
                case 'pensando':
                    archivoJson = 'mapache_pensando.json';
                    textoMensaje = 'Analizando las redes educativas (1-9)...';
                    break;
                case 'olfateando':
                    archivoJson = 'mapache_olfateando.json';
                    textoMensaje = 'Rastreando todos los colegios en el mapa...';
                    break;
                case 'sorprendido':
                    archivoJson = 'mapache_sorprendido.json';
                    textoMensaje = 'Mostrando Colegios Particulares.';
                    break;
                case 'durmiendo':
                    archivoJson = 'mapache_durmiendo.json';
                    textoMensaje = 'Zzz... Mapachito descansa un momento.';
                    break;
                default:
                    archivoJson = 'mapache_feliz.json';
                    textoMensaje = '¡Hola!';
                    break;
            }

            animacionEl.load(archivoJson);
            textoEl.innerText = textoMensaje;
            modalEl.style.display = 'flex';

            // Al cerrar el modal, ejecutamos la acción que correspondía (ej. ir al mapa)
            window.accionPendiente = callbackAccion;

            if(estado === 'durmiendo') {
                pararTemporizadorInactividad();
            }
        }

        function cerrarModalMapachito() {
            modalEl.style.display = 'none';
            reiniciarTemporizadorInactividad();
            if (window.accionPendiente) {
                let fn = window.accionPendiente;
                window.accionPendiente = null;
                fn();
            }
        }

        function irAEstadoDurmiente() {
            if (modalEl.style.display === 'none') {
                abrirModalMapachito('durmiendo', null);
            }
        }

        function reiniciarTemporizadorInactividad() {
            clearTimeout(tiempoInactividad);
            tiempoInactividad = setTimeout(irAEstadoDurmiente, SEGUNDOS_PARA_DORMIR * 1000);
        }

        function pararTemporizadorInactividad() {
            clearTimeout(tiempoInactividad);
        }

        // Manejo de botones de la pantalla principal con su respectivo modal y animación de Mapachito
        function ejecutarAccionBoton(tipoFiltro) {
            filtroActualGlobal = tipoFiltro;
            let estadoMapachito = 'olfateando';
            
            if (tipoFiltro === 'estatales') estadoMapachito = 'feliz';
            else if (tipoFiltro === 'particulares') estadoMapachito = 'sorprendido';
            else if (tipoFiltro === 'redes') estadoMapachito = 'pensando';

            abrirModalMapachito(estadoMapachito, function() {
                irAlMapa(tipoFiltro);
            });
        }

        function handleBusquedaPrincipal(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('inputBuscadorPrincipal').value.trim();
                if (query !== "") {
                    filtroActualGlobal = 'busqueda:' + query;
                    abrirModalMapachito('olfateando', function() {
                        irAlMapa(filtroActualGlobal);
                    });
                }
            }
        }

        /* --- CONTROL DE VISTAS Y MAPA --- */
        function irAlMapa(filtro) {
            document.getElementById('vista-portada').classList.remove('activa');
            document.getElementById('vista-mapa').classList.add('activa');

            if (!mapa) {
                mapa = L.map('mapa-container').setView([-11.8685, -77.1265], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(mapa);
                
                marcadoresLayer = L.layerGroup().addTo(mapa);
            } else {
                mapa.invalidateSize();
            }

            renderizarPines(filtro);
        }

        function volverAPortada() {
            document.getElementById('vista-mapa').classList.remove('activa');
            document.getElementById('vista-portada').classList.add('activa');
            document.getElementById('inputBuscadorPrincipal').value = '';
            reiniciarTemporizadorInactividad();
        }

        function renderizarPines(filtro) {
            if (!marcadoresLayer) return;
            marcadoresLayer.clearLayers();

            let colegiosFiltrados = colegiosData;

            if (filtro === 'estatales') {
                colegiosFiltrados = colegiosData.filter(c => c.tipo === 'estatal');
            } else if (filtro === 'particulares') {
                colegiosFiltrados = colegiosData.filter(c => c.tipo === 'particular');
            } else if (filtro === 'redes') {
                // Aquí puedes mostrar todos o un subconjunto de redes (1-9)
                colegiosFiltrados = colegiosData;
            } else if (filtro && filtro.startsWith('busqueda:')) {
                let query = filtro.replace('busqueda:', '').toLowerCase();
                colegiosFiltrados = colegiosData.filter(c => 
                    c.nombre.toLowerCase().includes(query) || c.codigo.includes(query)
                );
                document.getElementById('inputBuscadorMapa').value = query;
            }

            colegiosFiltrados.forEach(colegio => {
                let marker = L.marker([colegio.lat, colegio.lng]);
                
                // Ventana desplegable (Popup) con la información general del colegio
                let contenidoPopup = `
                    <div style="font-family: 'Montserrat', sans-serif; color: #0f172a; min-width: 180px;">
                        <h3 style="margin: 0 0 8px 0; font-size: 15px; color: #1e293b;">${colegio.nombre}</h3>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Código:</b> ${colegio.codigo}</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Tipo:</b> ${colegio.tipo.toUpperCase()}</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Red Educativa:</b> ${colegio.red}</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Dirección:</b> ${colegio.direccion}</p>
                    </div>
                `;

                marker.bindPopup(contenidoPopup);
                marcadoresLayer.addLayer(marker);
            });
        }

        function filtrarColegiosMapa() {
            let query = document.getElementById('inputBuscadorMapa').value.toLowerCase();
            if(!marcadoresLayer) return;
            marcadoresLayer.clearLayers();

            let colegiosFiltrados = colegiosData.filter(c => 
                c.nombre.toLowerCase().includes(query) || c.codigo.includes(query) || c.red.toLowerCase().includes(query)
            );

            colegiosFiltrados.forEach(colegio => {
                let marker = L.marker([colegio.lat, colegio.lng]);
                let contenidoPopup = `
                    <div style="font-family: 'Montserrat', sans-serif; color: #0f172a; min-width: 180px;">
                        <h3 style="margin: 0 0 8px 0; font-size: 15px; color: #1e293b;">${colegio.nombre}</h3>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Código:</b> ${colegio.codigo}</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Tipo:</b> ${colegio.tipo.toUpperCase()}</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Red Educativa:</b> ${colegio.red}</p>
                        <p style="margin: 4px 0; font-size: 13px;"><b>Dirección:</b> ${colegio.direccion}</p>
                    </div>
                `;
                marker.bindPopup(contenidoPopup);
                marcadoresLayer.addLayer(marker);
            });
        }

        window.onload = function() {
            abrirModalMapachito('saludando', null);

            window.addEventListener('mousemove', reiniciarTemporizadorInactividad);
            window.addEventListener('mousedown', reiniciarTemporizadorInactividad);
            window.addEventListener('keypress', reiniciarTemporizadorInactividad);
            window.addEventListener('touchstart', reiniciarTemporizadorInactividad);
        };
    </script>
</body>
</html>
