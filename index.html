<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAPACHE - Ventanilla & Mi Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. Configuración general y soporte de refresh nativo */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background-color: #0f172a;
            overflow-y: auto;          
            overscroll-behavior-y: auto; 
        }

        /* 2. Contenedor del fondo de pantalla fijo */
        .fondo-portada {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            pointer-events: none; 
            overflow: hidden;
        }

        /* 3. Control inteligente de imágenes de fondo */
        .img-celular {
            display: block;
            width: 100%;
            height: 100%; 
            object-fit: fill; 
            position: absolute;
            top: 0; 
            left: 0;
            object-position: center; 
        }

        .img-pc {
            display: none;
            width: 100%;       
            height: 100%;
            object-fit: fill; 
            margin-left: 0;  
        }

        /* 4. Contenedor principal estático y centrado */
        .main-container { 
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 2;
            max-width: 390px; 
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 5. Bloque del Buscador y Botones */
        .bloque-controles {
            width: 90%;                    
            max-width: 340px;              
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85); 
            padding: 16px;
            border-radius: 22px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.3); 
            box-sizing: border-box;
        }

        .input-busqueda {
            width: 100%;
            padding: 14px 16px;
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        /* Estilo base para los botones */
        .btn-opcion {
            width: 100%;
            padding: 14px 16px;
            color: #ffffff;            
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-opcion:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        /* Colores exactos personalizados por botón */
        .btn-verde {
            background-color: #729b79; 
            box-shadow: 0 0 12px rgba(114, 155, 121, 0.4);
        }

        .btn-azul {
            background-color: #7b8db9; 
            box-shadow: 0 0 12px rgba(123, 141, 185, 0.4);
        }

        .btn-estatales {
            background-color: #d18b6d; 
            box-shadow: 0 0 12px rgba(209, 139, 109, 0.4);
        }

        .btn-particulares {
            background-color: #a8a697; 
            color: #1e293b;            
            box-shadow: 0 0 12px rgba(168, 166, 151, 0.4);
        }

        .fila-botones-dividida {
            display: flex; 
            gap: 8px; 
            width: 100%;
        }

        .fila-botones-dividida .btn-opcion {
            flex: 1; 
        }

        /* 6. Estilos de la ventana emergente tipo Historieta con Mapache ilustrado por código (SVG) en ambos formatos */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content-comic {
            background: rgba(15, 23, 42, 0.95);
            padding: 24px 20px;
            border-radius: 24px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.8);
            max-width: 290px;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Bocadillo de pensamiento saliendo de la cabeza del mapache */
        .thought-bubble {
            position: relative;
            background: #ffffff;
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 85%;
            box-sizing: border-box;
            animation: floatBubble 1.5s infinite ease-in-out;
        }

        /* Bolitas del pensamiento que conectan con el mapache de cuerpo entero */
        .thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
        }
        .thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%) translateX(-4px);
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Contenedor del mapa / diseño vectorial de cuerpo entero del mapache saltando */
        .raccoon-svg-container {
            width: 120px;
            height: 140px;
            margin-bottom: 16px;
            animation: jumpRaccoon 0.8s infinite alternate ease-in-out;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6));
        }

        @keyframes jumpRaccoon {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.03); }
        }

        .modal-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        /* 7. Adaptación para Computadora / PC (Pantallas mayores a 768px) */
        @media (min-width: 769px) {
            .img-celular {
                display: none;
            }
            .img-pc {
                display: block;
            }

            .bloque-controles {
                width: 100%;
                max-width: 520px;          
                padding: 24px;             
                gap: 16px;
                border-radius: 26px;
            }

            .input-busqueda {
                padding: 16px 20px;
                font-size: 15px;           
                border-radius: 16px;
            }

            .btn-opcion {
                padding: 16px 20px;        
                font-size: 15px;           
                border-radius: 16px;
            }

            .fila-botones-dividida .btn-opcion {
                padding: 16px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo de pantalla adaptativo -->
    <div class="fondo-portada">
        <img src="portada-celular.jpg" alt="Portada Celular" class="img-celular">
        <img src="portada-pc.jpg" alt="Portada PC" class="img-pc">
    </div>

    <!-- Contenedor principal de la interfaz y botones -->
    <div class="main-container">
        <div class="bloque-controles">
            <input type="text" class="input-busqueda" placeholder="Buscar por nombre o número...">
            <button class="btn-opcion btn-verde">Ver Todos los Colegios en el Mapa</button>
            <button class="btn-opcion btn-azul">Filtrar por Redes Educativas (1-9)</button>
            <div class="fila-botones-dividida">
                <button class="btn-opcion btn-estatales">Colegios Estatales</button>
                <button class="btn-opcion btn-particulares" onclick="mostrarAviso();">Colegios Particulares</button>
            </div>
        </div>
    </div>

    <!-- Ventana emergente con el mapache de cuerpo entero y saltando de alegría -->
    <div id="modalAviso" class="modal-overlay" onclick="cerrarAviso()">
        <div class="modal-content-comic" onclick="event.stopPropagation()">
            <!-- Pensamiento saliendo de la cabeza -->
            <div class="thought-bubble">
                ¡Próximamente!
            </div>
            
            <!-- Mapache ilustrado de cuerpo entero, saltando con mochila y brazos abiertos -->
            <div class="raccoon-svg-container">
                <svg viewBox="0 0 200 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <!-- Mochila escolar azul con detalles -->
                    <rect x="75" y="105" width="50" height="60" rx="12" fill="#2563eb"/>
                    <rect x="90" y="115" width="20" height="25" rx="6" fill="#1e40af"/>
                    <circle cx="100" cy="148" r="4" fill="#fbbf24"/>

                    <!-- Cuerpo completo del mapache (Pancita y torso) -->
                    <ellipse cx="100" cy="135" rx="35" ry="42" fill="#8c7865"/>
                    <ellipse cx="100" cy="140" rx="22" ry="30" fill="#f5f5f4"/>

                    <!-- Patas traseras (Saltando hacia arriba) -->
                    <ellipse cx="75" cy="180" rx="12" ry="18" fill="#574837" transform="rotate(-15 75 180)"/>
                    <ellipse cx="125" cy="180" rx="12" ry="18" fill="#574837" transform="rotate(15 125 180)"/>
                    <!-- Huellas de las patitas -->
                    <ellipse cx="73" cy="190" rx="7" ry="5" fill="#a89f91"/>
                    <ellipse cx="127" cy="190" rx="7" ry="5" fill="#a89f91"/>

                    <!-- Brazos abiertos de alegría -->
                    <path d="M 70 115 Q 45 100 40 85 C 38 78 48 76 52 83 C 62 95 72 110 75 118 Z" fill="#8c7865"/>
                    <path d="M 130 115 Q 155 100 160 85 C 162 78 152 76 148 83 C 138 95 128 110 125 118 Z" fill="#8c7865"/>

                    <!-- Cabeza del mapache -->
                    <circle cx="100" cy="85" r="42" fill="#8c7865"/>
                    
                    <!-- Orejas -->
                    <polygon points="68,58 52,30 78,48" fill="#574837"/>
                    <polygon points="69,56 58,36 75,47" fill="#f5f5f4"/>
                    <polygon points="132,58 148,30 122,48" fill="#574837"/>
                    <polygon points="131,56 142,36 125,47" fill="#f5f5f4"/>

                    <!-- Antifaz característico -->
                    <path d="M 62 75 Q 80 95 100 82 Q 120 95 138 75 C 145 100 115 115 100 110 C 85 115 55 100 62 75 Z" fill="#362922"/>

                    <!-- Ojos brillantes de felicidad -->
                    <circle cx="82" cy="83" r="7" fill="#ffffff"/>
                    <circle cx="83" cy="82" r="3" fill="#0f172a"/>
                    <circle cx="118" cy="83" r="7" fill="#ffffff"/>
                    <circle cx="117" cy="82" r="3" fill="#0f172a"/>
                    <!-- Brillo en los ojos -->
                    <circle cx="85" cy="80" r="1.5" fill="#ffffff"/>
                    <circle cx="119" cy="80" r="1.5" fill="#ffffff"/>

                    <!-- Hocico -->
                    <ellipse cx="100" cy="97" rx="12" ry="9" fill="#f5f5f4"/>
                    <ellipse cx="100" cy="94" rx="5" ry="3" fill="#1c1917"/>

                    <!-- Sonrisa grande y alegre -->
                    <path d="M 90 102 Q 100 112 110 102" fill="none" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>

                    <!-- Rayas en la cola que asoma por detrás -->
                    <path d="M 125 155 Q 155 160 165 140 C 170 130 160 120 150 130" fill="none" stroke="#574837" stroke-width="14" stroke-linecap="round"/>
                    <path d="M 137 148 Q 152 152 158 140" fill="none" stroke="#f5f5f4" stroke-width="5" stroke-linecap="round"/>
                </svg>
            </div>

            <button class="modal-btn" onclick="cerrarAviso()">Aceptar</button>
        </div>
    </div>

    <script>
        function mostrarAviso() {
            document.getElementById('modalAviso').style.display = 'flex';
        }
        function cerrarAviso() {
            document.getElementById('modalAviso').style.display = 'none';
        }
    </script>

</body>
</html>
